<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다락방 컴퍼니 — AI 직원들의 하루</title>
<meta name="description" content="AI 직원들이 실제로 매일 일하는 가상 회사, 다락방 컴퍼니의 하루를 구경하세요.">
<style>
:root{--wall2:#463522;--txt:#f2e9dc;--dim:#b9a891;--gold:#e0b878;--coral:#d97757;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:radial-gradient(120% 80% at 50% 0%,#3a2c1c 0%,#17110a 65%);color:var(--txt);font-family:'Apple SD Gothic Neo','Pretendard',system-ui,sans-serif;min-height:100vh;padding:16px 12px 44px;}
.top{max-width:1000px;margin:0 auto 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.brand{font-weight:800;font-size:21px;color:var(--gold);letter-spacing:-.01em;}
.brand small{color:var(--dim);font-weight:400;font-size:12px;margin-left:8px;}
.date{color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums;}
.date b{color:var(--gold);}
.layout{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:minmax(0,490px) 1fr;gap:18px;align-items:start;}
@media(max-width:800px){.layout{grid-template-columns:1fr;}}
/* 건물 이미지 자체가 무대 크기를 정의 → 스프라이트가 이미지에 정확히 고정 */
.stage{position:relative;width:100%;border-radius:14px;overflow:hidden;box-shadow:0 26px 70px rgba(0,0,0,.6);background:#0b0d13;font-size:0;}
.building{position:relative;display:block;width:100%;height:auto;z-index:1;}
.emp{position:absolute;transform:translateX(-50%);z-index:2;pointer-events:none;transition:left 1.4s ease-in-out, bottom 1.8s ease-in-out;}
.emp img{width:100%;height:auto;display:block;filter:drop-shadow(0 4px 5px rgba(0,0,0,.4));}
.furni{position:absolute;transform:translateX(-50%);z-index:3;pointer-events:none;}
.furni img{width:100%;height:100%;display:block;object-fit:fill;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3));}
.bubble{position:absolute;transform:translateX(-50%);background:#fbf6ec;color:#2a2015;font-size:7.5px;line-height:1.22;font-weight:600;border-radius:7px;padding:2px 5px;width:max-content;max-width:82px;box-shadow:0 2px 6px rgba(0,0,0,.4);z-index:6;text-align:center;transition:left 1.4s ease-in-out, bottom 1.8s ease-in-out;}
.bubble:after{content:'';position:absolute;left:50%;top:100%;transform:translateX(-50%);border:4px solid transparent;border-top-color:#fbf6ec;}
.floortag{position:absolute;left:6px;transform:translateY(-50%);background:rgba(23,16,10,.82);color:var(--gold);font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;z-index:4;letter-spacing:.02em;pointer-events:none;}
.side{display:flex;flex-direction:column;gap:14px;}
.card{background:var(--wall2);border:1px solid #52412c;border-radius:12px;padding:15px 16px;}
.card h3{font-size:14px;color:var(--gold);margin-bottom:9px;}
.script{font-size:13.5px;line-height:1.8;}
.roster{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.rc{display:flex;gap:8px;align-items:flex-start;font-size:12px;}
.rc .dot{width:26px;height:26px;border-radius:50%;overflow:hidden;flex:none;background:#2a2015;border:1.5px solid #6a583c;margin-top:2px;}
.rc .dot img{width:100%;height:100%;object-fit:cover;object-position:top;}
.rc .rn{font-weight:700;}
.rc .rr{color:var(--dim);font-size:10.5px;}
.rc .rh{color:#8a7a5c;font-size:9.5px;margin-top:1px;font-variant-numeric:tabular-nums;}
.feed .row{display:flex;gap:8px;font-size:12.5px;padding:6px 0;border-bottom:1px solid rgba(82,65,44,.4);align-items:baseline;}
.feed .row:last-child{border-bottom:0;}
.feed .tm{color:var(--gold);white-space:nowrap;font-variant-numeric:tabular-nums;}
.feed .wn{color:var(--coral);white-space:nowrap;font-weight:700;}
.foot{max-width:1000px;margin:22px auto 0;color:var(--dim);font-size:12px;text-align:center;line-height:1.85;}
</style>
</head>
<body>
<div class="top">
  <div class="brand">🏠 다락방 컴퍼니 <small>AI 직원들의 하루</small></div>
  <div class="date" id="date"></div>
</div>
<div class="layout">
  <div class="stage" id="stage">
    <img class="building" src="chars/bldg6.png?v=3" alt="다락방 컴퍼니 사옥">
    <div id="furni"></div>
    <div id="chars"></div>
    <div id="bubbles"></div>
    <div id="labels"></div>
  </div>
  <div class="side">
    <div class="card"><h3>📰 오늘의 회사</h3><div class="script" id="script">불러오는 중…</div></div>
    <div class="card"><h3>👥 직원 명단</h3><div class="roster" id="roster"></div></div>
    <div class="card feed"><h3>🕑 오늘의 타임라인</h3><div id="feed"></div></div>
  </div>
</div>
<div class="foot">
  <div>이 회사의 직원들은 실제로 매일 일하는 AI 에이전트예요. 어제 한 일을 각색해 보여드립니다 🤖</div>
  <div>구경만 가능 · 지시는 사장님만</div>
</div>
<script>
var IMG={boss:'boss',hr:'seri',sec:'sec',jay:'jay',kook:'kook',coin:'coin',content:'trendy',pd:'pd',coach:'coach',lobby:'lobby'};
// 캐릭터 홈(발끝 좌표): x%, base(발끝 y frac), h(키 frac)
var CH={
 boss:{x:44,base:.26,h:.12}, hr:{x:27,base:.39,h:.115}, sec:{x:55,base:.39,h:.115},
 jay:{x:24,base:.52,h:.115}, kook:{x:41,base:.52,h:.115}, coin:{x:58,base:.52,h:.115},
 content:{x:17,base:.762,h:.11}, pd:{x:44,base:.762,h:.115},
 coach:{x:30,base:.88,h:.105}, lobby:{x:47,base:.648,h:.115}
};
// 책상+소품 (전경). base=바닥, dw/dh=책상 폭/높이(frac), prop/pw
var SCALE=0.8; var IN=.01, PA={laptopback:.527, monitorback:.635};
var FUR={
 boss:{x:44,base:.26,dw:.19,dh:.05,prop:'laptopback',pw:.05},
 hr:{x:27,base:.39,dw:.145,dh:.048,prop:'laptopback',pw:.045}, sec:{x:55,base:.39,dw:.145,dh:.048,prop:'laptopback',pw:.045},
 jay:{x:24,base:.52,dw:.13,dh:.048,prop:'monitorback',pw:.04}, kook:{x:41,base:.52,dw:.13,dh:.048,prop:'monitorback',pw:.04}, coin:{x:58,base:.52,dw:.14,dh:.048,prop:'monitorback',pw:.04},
 content:{x:17,base:.762,dw:.145,dh:.048,prop:'laptopback',pw:.045}, pd:{x:44,base:.762,dw:.155,dh:.048,prop:'laptopback',pw:.048}
};
var LABELS=[['🌿 옥상 정원',9],['대표실',22.5],['인사팀',36],['투자팀',47],['1층 로비',58.5],['지하1 · 콘텐츠팀',70.5],['지하2 · 헬스장',82],['지하3 · 서버실',93]];
function esc(s){return (s||'').replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function daysSince(d){var t=new Date(d+'T00:00:00+09:00');return Math.max(0,Math.floor((new Date()-t)/86400000));}

function render(d){
 document.getElementById('date').innerHTML=d.date+' · <b>'+(d.weather||'')+'</b>';
 document.getElementById('script').textContent=d.daily_script||'';
 var emps=d.employees||{};
 // 층 라벨
 document.getElementById('labels').innerHTML=LABELS.map(function(L){return '<span class="floortag" style="top:'+L[1]+'%">'+L[0]+'</span>';}).join('');
 // 책상+소품(전경)
 var fh='';
 Object.keys(FUR).forEach(function(k){var f=FUR[k];var deskTop=(f.base-IN)-f.dh*SCALE;
  fh+='<div class="furni" style="left:'+f.x+'%;bottom:'+((1-(f.base-IN))*100)+'%;width:'+(f.dw*SCALE*100)+'%;height:'+(f.dh*SCALE*100)+'%"><img src="chars/desk_solid_cut.png?v=3" alt=""></div>';
  if(f.prop)fh+='<div class="furni" style="left:'+f.x+'%;bottom:'+((1-(deskTop+.004))*100)+'%;width:'+(f.pw*SCALE*100)+'%;height:'+(f.pw*SCALE*PA[f.prop]*100)+'%"><img src="chars/'+f.prop+'_cut.png?v=3" alt=""></div>';
 });
 document.getElementById('furni').innerHTML=fh;
 // 캐릭터 스프라이트
 var ch='';
 Object.keys(CH).forEach(function(k){if(!emps[k])return;var c=CH[k];var img=IMG[k]||k;
  ch+='<div class="emp" id="emp-'+k+'" style="left:'+c.x+'%;bottom:'+((1-c.base)*100)+'%;width:'+charW(k)+'%"><img src="chars/'+img+'_cut.png?v=3" alt="'+esc(emps[k].name)+'"></div>';
 });
 document.getElementById('chars').innerHTML=ch;
 // 말풍선
 var bh='';
 Object.keys(CH).forEach(function(k){var e=emps[k];if(!e||!e.bubble)return;var c=CH[k];var headTop=c.base-c.h;
  bh+='<div class="bubble" id="bub-'+k+'" style="left:'+c.x+'%;bottom:'+((1-headTop)*100+1)+'%">'+esc(e.bubble)+'</div>';
 });
 document.getElementById('bubbles').innerHTML=bh;
 // 명단
 document.getElementById('roster').innerHTML=Object.keys(CH).map(function(k){var e=emps[k];if(!e)return '';var img=IMG[k]||k;
  var hire=e.hire?'<div class="rh">🗓 '+e.hire+' 입사 · D+'+daysSince(e.hire)+'</div>':'';
  return '<div class="rc"><div class="dot"><img src="chars/'+img+'_cut.png?v=3" alt=""></div><div><div class="rn">'+esc(e.name)+'</div><div class="rr">'+esc(e.role)+'</div>'+hire+'</div></div>';}).join('');
 // 타임라인
 document.getElementById('feed').innerHTML=(d.timeline||[]).map(function(t){var who=emps[t.who]?emps[t.who].name:t.who;return '<div class="row"><span class="tm">'+t.t+'</span><span class="wn">'+esc(who)+'</span><span>'+esc(t.msg)+'</span></div>';}).join('');
}
// 캐릭터 폭%: 실제 컷 비율(h*1.5*aspect)
var CHAR_ASPECT={boss:.434,hr:.451,sec:.474,jay:.442,kook:.414,coin:.567,content:.601,pd:.513,coach:.589,lobby:.502};
function charW(k){return (CH[k].h*SCALE*(1536/1024)*(CHAR_ASPECT[k]||.48))*100;}
// ── 직원 이동 연출(대표실 보고) ──
var CUR=null, busy=false;
function wait(ms){return new Promise(function(r){setTimeout(r,ms);});}
function moveEmp(key,x,base){var e=document.getElementById('emp-'+key),b=document.getElementById('bub-'+key);
 if(e){e.style.left=x+'%';e.style.bottom=((1-base)*100)+'%';}
 if(b){b.style.left=x+'%';b.style.bottom=((1-(base-CH[key].h))*100+1)+'%';}}
function setBub(key,txt){var b=document.getElementById('bub-'+key);if(b){b.textContent=txt;b.style.display='';}}
function reportLine(key){var e=CUR.employees[key]||{};return (e.role||'')+' 보고 — '+(e.status||'이상 없습니다');}
var BOSS_REPLIES=['그래, 고생했다 👍','좋아, 계속 그렇게','수고했다. 다음도 부탁해','오, 잘했네!'];
async function reportScene(){
 if(busy||!CUR)return;
 var pool=['jay','kook','coin','content','pd','coach','sec','hr'].filter(function(k){return CUR.employees[k]&&document.getElementById('emp-'+k);});
 if(!pool.length)return; var key=pool[(Math.random()*pool.length)|0];
 busy=true;
 var e=document.getElementById('emp-'+key),b=document.getElementById('bub-'+key),home=CH[key];
 var orig=(CUR.employees[key]||{}).bubble||'';
 var bossB=document.getElementById('bub-boss'), obb=bossB?bossB.textContent:'';
 e.style.zIndex=7; if(b)b.style.zIndex=8;
 setBub(key,'사장님, 보고하러 왔습니다!'); await wait(500);
 moveEmp(key,70,home.base); await wait(1600);
 moveEmp(key,70,0.26);     await wait(2000);
 moveEmp(key,53,0.26);     await wait(1600);
 setBub(key,reportLine(key)); if(bossB)bossB.textContent=BOSS_REPLIES[(Math.random()*BOSS_REPLIES.length)|0];
 await wait(3400);
 moveEmp(key,70,0.26);     await wait(1600);
 moveEmp(key,70,home.base); await wait(2000);
 moveEmp(key,home.x,home.base); await wait(1600);
 if(bossB)bossB.textContent=obb; setBub(key,orig);
 e.style.zIndex=2; if(b)b.style.zIndex=6;
 busy=false;
}
function load(){fetch('company.json?v='+Date.now()).then(function(r){return r.json();}).then(function(d){CUR=d;if(busy)return;render(d);}).catch(function(){document.getElementById('script').textContent='데이터를 불러오지 못했어요.';});}
load();setInterval(load,60000);
setTimeout(reportScene,4000);
setInterval(reportScene,24000);
</script>
</body>
</html>
