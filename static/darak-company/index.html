<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다락방 컴퍼니 — AI 직원들의 하루</title>
<meta name="description" content="AI 직원들이 실제로 매일 일하는 가상 회사, 다락방 컴퍼니의 하루를 구경하세요.">
<style>
:root{--wall2:#463522;--txt:#f2e9dc;--dim:#b9a891;--gold:#e0b878;--coral:#d97757;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:radial-gradient(120% 80% at 50% 0%,#3a2c1c 0%,#17110a 65%);color:var(--txt);font-family:'Apple SD Gothic Neo','Pretendard',system-ui,sans-serif;min-height:100vh;padding:16px 12px 44px;}
.top{max-width:1000px;margin:0 auto 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.brand{font-weight:800;font-size:21px;color:var(--gold);letter-spacing:-.01em;}
.brand small{color:var(--dim);font-weight:400;font-size:12px;margin-left:8px;}
.date{color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums;}
.date b{color:var(--gold);}
.layout{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:minmax(0,490px) 1fr;gap:18px;align-items:start;}
@media(max-width:800px){.layout{grid-template-columns:1fr;}}
.stage{position:relative;width:100%;aspect-ratio:1024/1536;border-radius:14px;overflow:hidden;box-shadow:0 26px 70px rgba(0,0,0,.6);background:#0b0d13;}
/* 배경 레이어(날씨·계절) */
.sky{position:absolute;left:0;right:0;top:0;height:62%;transition:background 1.2s;}
.ground{position:absolute;left:0;right:0;bottom:0;height:38%;transition:background 1.2s;}
.scene-hill{position:absolute;left:0;right:0;top:44%;height:20%;opacity:.85;transition:background 1.2s;}
.wfx{position:absolute;inset:0;pointer-events:none;z-index:5;}
.grade{position:absolute;inset:0;pointer-events:none;z-index:4;transition:background 1.2s;mix-blend-mode:soft-light;}
.sun{position:absolute;border-radius:50%;pointer-events:none;z-index:0;transition:opacity 1.2s;}
.building{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:1;}
.emp{position:absolute;transform:translateX(-50%);z-index:2;pointer-events:none;transition:left 1.4s ease-in-out, bottom 1.8s ease-in-out;}
.emp img{width:100%;height:auto;display:block;filter:drop-shadow(0 4px 5px rgba(0,0,0,.4));}
.furni{position:absolute;transform:translateX(-50%);z-index:3;pointer-events:none;}
.furni img{width:100%;height:100%;display:block;object-fit:fill;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3));}
.bubble{position:absolute;transform:translateX(-50%);background:#fbf6ec;color:#2a2015;font-size:10.5px;line-height:1.28;font-weight:600;border-radius:9px;padding:4px 8px;width:max-content;max-width:112px;box-shadow:0 3px 9px rgba(0,0,0,.45);z-index:6;text-align:center;transition:left 1.4s ease-in-out, bottom 1.8s ease-in-out;}
.bubble:after{content:'';position:absolute;left:50%;top:100%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#fbf6ec;}
.floortag{position:absolute;left:6px;transform:translateY(-50%);background:rgba(23,16,10,.82);color:var(--gold);font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;z-index:4;letter-spacing:.02em;pointer-events:none;}
.side{display:flex;flex-direction:column;gap:14px;}
.card{background:var(--wall2);border:1px solid #52412c;border-radius:12px;padding:15px 16px;}
.card h3{font-size:14px;color:var(--gold);margin-bottom:9px;}
.script{font-size:13.5px;line-height:1.8;}
.roster{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.rc{display:flex;gap:8px;align-items:flex-start;font-size:12px;}
.rc .dot{width:26px;height:26px;border-radius:50%;overflow:hidden;flex:none;background:#2a2015;border:1.5px solid #6a583c;margin-top:2px;}
.rc .dot img{width:100%;height:100%;object-fit:cover;object-position:top;}
.rc .rn{font-weight:700;}
.rc .rr{color:var(--dim);font-size:10.5px;}
.rc .rh{color:#8a7a5c;font-size:9.5px;margin-top:1px;font-variant-numeric:tabular-nums;}
.feed .row{display:flex;gap:8px;font-size:12.5px;padding:6px 0;border-bottom:1px solid rgba(82,65,44,.4);align-items:baseline;}
.feed .row:last-child{border-bottom:0;}
.feed .tm{color:var(--gold);white-space:nowrap;font-variant-numeric:tabular-nums;}
.feed .wn{color:var(--coral);white-space:nowrap;font-weight:700;}
.foot{max-width:1000px;margin:22px auto 0;color:var(--dim);font-size:12px;text-align:center;line-height:1.85;}
</style>
</head>
<body>
<div class="top">
  <div class="brand">🏠 다락방 컴퍼니 <small>AI 직원들의 하루</small></div>
  <div class="date" id="date"></div>
</div>
<div class="layout">
  <div class="stage" id="stage">
    <div class="sky" id="sky"></div>
    <div class="scene-hill" id="hill"></div>
    <div class="ground" id="ground"></div>
    <div class="sun" id="sun"></div>
    <div class="grade" id="grade"></div>
    <canvas class="wfx" id="wfx" width="410" height="615"></canvas>
    <img class="building" src="chars/bldg6_t.png" alt="다락방 컴퍼니 사옥">
    <div id="furni"></div>
    <div id="chars"></div>
    <div id="bubbles"></div>
    <div id="labels"></div>
  </div>
  <div class="side">
    <div class="card"><h3>📰 오늘의 회사</h3><div class="script" id="script">불러오는 중…</div></div>
    <div class="card"><h3>👥 직원 명단</h3><div class="roster" id="roster"></div></div>
    <div class="card feed"><h3>🕑 오늘의 타임라인</h3><div id="feed"></div></div>
  </div>
</div>
<div class="foot">
  <div>이 회사의 직원들은 실제로 매일 일하는 AI 에이전트예요. 어제 한 일을 각색해 보여드립니다 🤖</div>
  <div>구경만 가능 · 지시는 사장님만</div>
</div>
<script>
var IMG={boss:'boss',hr:'seri',sec:'sec',jay:'jay',kook:'kook',coin:'coin',content:'trendy',pd:'pd',coach:'coach',lobby:'lobby'};
// 캐릭터 홈(발끝 좌표): x%, base(발끝 y frac), h(키 frac)
var CH={
 boss:{x:44,base:.30,h:.12}, hr:{x:27,base:.42,h:.115}, sec:{x:55,base:.42,h:.115},
 jay:{x:24,base:.52,h:.115}, kook:{x:41,base:.52,h:.115}, coin:{x:58,base:.52,h:.115},
 content:{x:17,base:.76,h:.11}, pd:{x:44,base:.76,h:.115},
 coach:{x:30,base:.88,h:.105}, lobby:{x:47,base:.645,h:.115}
};
// 책상+소품 (전경). base=바닥, dw/dh=책상 폭/높이(frac), prop/pw
var IN=.01, PA={laptopback:.527, monitorback:.635};
var FUR={
 boss:{x:44,base:.30,dw:.19,dh:.05,prop:'laptopback',pw:.05},
 hr:{x:27,base:.42,dw:.145,dh:.048,prop:'laptopback',pw:.045}, sec:{x:55,base:.42,dw:.145,dh:.048,prop:'laptopback',pw:.045},
 jay:{x:24,base:.52,dw:.13,dh:.048,prop:'monitorback',pw:.04}, kook:{x:41,base:.52,dw:.13,dh:.048,prop:'monitorback',pw:.04}, coin:{x:58,base:.52,dw:.14,dh:.048,prop:'monitorback',pw:.04},
 content:{x:17,base:.76,dw:.145,dh:.048,prop:'laptopback',pw:.045}, pd:{x:44,base:.76,dw:.155,dh:.048,prop:'laptopback',pw:.048}
};
var LABELS=[['🌿 옥상 정원',9],['대표실',22.5],['인사팀',36],['투자팀',47],['1층 로비',58.5],['지하1 · 콘텐츠팀',70.5],['지하2 · 헬스장',82],['지하3 · 서버실',93]];
function esc(s){return (s||'').replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function daysSince(d){var t=new Date(d+'T00:00:00+09:00');return Math.max(0,Math.floor((new Date()-t)/86400000));}

// ── 날씨·계절 배경 ──
function seasonOf(m){return (m===12||m<=2)?'winter':m<=5?'spring':m<=8?'summer':'autumn';}
function weatherOf(txt){txt=txt||'';if(/눈|설/.test(txt))return'snow';if(/비|우/.test(txt))return'rain';if(/흐림|구름|흐/.test(txt))return'cloud';if(/밤|야간/.test(txt))return'night';return'sunny';}
var SEASON_HILL={spring:'#8bbf6a',summer:'#4f9c4a',autumn:'#c88a3c',winter:'#cdd6df'};
var SEASON_GROUND={spring:'linear-gradient(#5a4326,#3a2c17)',summer:'linear-gradient(#54402a,#332310)',autumn:'linear-gradient(#5a3f22,#33230f)',winter:'linear-gradient(#6b5f52,#3c3128)'};
function skyGrad(w,season){
 var map={
  sunny:'linear-gradient(#7ec8f0 0%,#bfe6f7 60%,#e9f6fb 100%)',
  cloud:'linear-gradient(#9fb0bd 0%,#c3cdd4 70%,#dfe6ea 100%)',
  rain:'linear-gradient(#5a6b78 0%,#7d8b96 70%,#95a2ab 100%)',
  snow:'linear-gradient(#aab8c6 0%,#cdd8e2 60%,#eef3f7 100%)',
  night:'linear-gradient(#12203a 0%,#26344f 70%,#3a4763 100%)'
 };
 if(season==='autumn'&&w==='sunny')return'linear-gradient(#8fc0e6 0%,#d8e4d0 70%,#f2ecd6 100%)';
 return map[w]||map.sunny;
}
var wfxState={type:'none',parts:[]},wctx;
function setWeatherSeason(weatherTxt){
 var now=new Date(); var season=seasonOf(now.getMonth()+1);
 var w=weatherOf(weatherTxt);
 document.getElementById('sky').style.background=skyGrad(w,season);
 document.getElementById('hill').style.background='linear-gradient(to top, '+SEASON_HILL[season]+' 0%, transparent 100%)';
 document.getElementById('ground').style.background=SEASON_GROUND[season];
 // 전체 분위기 색보정(soft-light)
 var GRADE={sunny:'rgba(255,225,160,.45)',cloud:'rgba(150,160,172,.55)',rain:'rgba(70,95,120,.72)',snow:'rgba(205,222,240,.5)',night:'rgba(18,26,66,.9)'};
 var g=GRADE[w]||GRADE.sunny;
 if(w==='sunny'&&season==='autumn')g='rgba(255,190,110,.5)';
 if(w==='sunny'&&season==='winter')g='rgba(200,220,245,.4)';
 document.getElementById('grade').style.background=g;
 // 해/달
 var sun=document.getElementById('sun');
 if(w==='sunny'){sun.style.cssText='position:absolute;z-index:0;left:74%;top:4%;width:14%;height:9%;border-radius:50%;background:radial-gradient(circle,#fff6d8,rgba(255,240,190,.5) 45%,transparent 72%);opacity:1;';}
 else if(w==='night'){sun.style.cssText='position:absolute;z-index:0;left:76%;top:5%;width:8%;height:5.3%;border-radius:50%;background:radial-gradient(circle,#eef2ff,rgba(210,220,255,.4) 55%,transparent 75%);opacity:1;';}
 else{sun.style.opacity='0';}
 // 파티클
 var cv=document.getElementById('wfx'); wctx=cv.getContext('2d');
 wfxState.type=(w==='rain')?'rain':(w==='snow'||season==='winter'&&w!=='sunny')?'snow':'none';
 wfxState.parts=[];
 var n=wfxState.type==='rain'?90:wfxState.type==='snow'?70:0;
 for(var i=0;i<n;i++)wfxState.parts.push({x:Math.random()*cv.width,y:Math.random()*cv.height,s:1+Math.random()*2,r:1+Math.random()*2});
}
function wfxLoop(){
 if(!wctx){requestAnimationFrame(wfxLoop);return;}
 var cv=wctx.canvas; wctx.clearRect(0,0,cv.width,cv.height);
 if(wfxState.type==='rain'){wctx.strokeStyle='rgba(180,200,220,.5)';wctx.lineWidth=1.2;
  wfxState.parts.forEach(function(p){wctx.beginPath();wctx.moveTo(p.x,p.y);wctx.lineTo(p.x-2,p.y+9*p.s);wctx.stroke();p.y+=9*p.s;p.x-=1.4;if(p.y>cv.height){p.y=-8;p.x=Math.random()*cv.width;}});}
 else if(wfxState.type==='snow'){wctx.fillStyle='rgba(255,255,255,.85)';
  wfxState.parts.forEach(function(p){wctx.beginPath();wctx.arc(p.x,p.y,p.r,0,7);wctx.fill();p.y+=0.7*p.s;p.x+=Math.sin(p.y/28)*0.5;if(p.y>cv.height){p.y=-6;p.x=Math.random()*cv.width;}});}
 requestAnimationFrame(wfxLoop);
}
requestAnimationFrame(wfxLoop);

function render(d){
 var seasonTxt={winter:'겨울',spring:'봄',summer:'여름',autumn:'가을'}[seasonOf(new Date().getMonth()+1)];
 document.getElementById('date').innerHTML=d.date+' · <b>'+(d.weather||'')+'</b> · '+seasonTxt;
 document.getElementById('script').textContent=d.daily_script||'';
 setWeatherSeason(d.weather);
 var emps=d.employees||{};
 // 층 라벨
 document.getElementById('labels').innerHTML=LABELS.map(function(L){return '<span class="floortag" style="top:'+L[1]+'%">'+L[0]+'</span>';}).join('');
 // 책상+소품(전경)
 var fh='';
 Object.keys(FUR).forEach(function(k){var f=FUR[k];var deskTop=(f.base-IN)-f.dh;
  fh+='<div class="furni" style="left:'+f.x+'%;bottom:'+((1-(f.base-IN))*100)+'%;width:'+(f.dw*100)+'%;height:'+(f.dh*100)+'%"><img src="chars/desk_solid_cut.png" alt=""></div>';
  if(f.prop)fh+='<div class="furni" style="left:'+f.x+'%;bottom:'+((1-(deskTop+.004))*100)+'%;width:'+(f.pw*100)+'%;height:'+(f.pw*PA[f.prop]*100)+'%"><img src="chars/'+f.prop+'_cut.png" alt=""></div>';
 });
 document.getElementById('furni').innerHTML=fh;
 // 캐릭터 스프라이트
 var ch='';
 Object.keys(CH).forEach(function(k){if(!emps[k])return;var c=CH[k];var img=IMG[k]||k;
  ch+='<div class="emp" id="emp-'+k+'" style="left:'+c.x+'%;bottom:'+((1-c.base)*100)+'%;width:'+charW(k)+'%"><img src="chars/'+img+'_cut.png" alt="'+esc(emps[k].name)+'"></div>';
 });
 document.getElementById('chars').innerHTML=ch;
 // 말풍선
 var bh='';
 Object.keys(CH).forEach(function(k){var e=emps[k];if(!e||!e.bubble)return;var c=CH[k];var headTop=c.base-c.h;
  bh+='<div class="bubble" id="bub-'+k+'" style="left:'+c.x+'%;bottom:'+((1-headTop)*100+1)+'%">'+esc(e.bubble)+'</div>';
 });
 document.getElementById('bubbles').innerHTML=bh;
 // 명단
 document.getElementById('roster').innerHTML=Object.keys(CH).map(function(k){var e=emps[k];if(!e)return '';var img=IMG[k]||k;
  var hire=e.hire?'<div class="rh">🗓 '+e.hire+' 입사 · D+'+daysSince(e.hire)+'</div>':'';
  return '<div class="rc"><div class="dot"><img src="chars/'+img+'_cut.png" alt=""></div><div><div class="rn">'+esc(e.name)+'</div><div class="rr">'+esc(e.role)+'</div>'+hire+'</div></div>';}).join('');
 // 타임라인
 document.getElementById('feed').innerHTML=(d.timeline||[]).map(function(t){var who=emps[t.who]?emps[t.who].name:t.who;return '<div class="row"><span class="tm">'+t.t+'</span><span class="wn">'+esc(who)+'</span><span>'+esc(t.msg)+'</span></div>';}).join('');
}
// 캐릭터 폭%: 이미지 비율 근사 (h*1.5*aspect). aspect는 대략 0.45 가정, 개별 미세조정 생략
var CHAR_ASPECT={boss:.43,hr:.45,sec:.47,jay:.44,kook:.41,coin:.57,content:.60,pd:.51,coach:.59,lobby:.48};
function charW(k){return (CH[k].h*(1536/1024)*(CHAR_ASPECT[k]||.48))*100;}
function load(){fetch('company.json?v='+Date.now()).then(function(r){return r.json();}).then(render).catch(function(){document.getElementById('script').textContent='데이터를 불러오지 못했어요.';});}
load();setInterval(load,60000);
</script>
</body>
</html>
