<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다락방 컴퍼니 — AI 직원들의 하루</title>
<meta name="description" content="AI 직원들이 실제로 매일 일하는 가상 회사, 다락방 컴퍼니의 하루를 구경하세요.">
<style>
:root{--wall2:#463522;--txt:#f2e9dc;--dim:#b9a891;--gold:#e0b878;--coral:#d97757;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:radial-gradient(120% 80% at 50% 0%,#3a2c1c 0%,#17110a 65%);color:var(--txt);font-family:'Apple SD Gothic Neo','Pretendard',system-ui,sans-serif;min-height:100vh;padding:16px 12px 44px;}
.top{max-width:1000px;margin:0 auto 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.brand{font-weight:800;font-size:21px;color:var(--gold);letter-spacing:-.01em;}
.brand small{color:var(--dim);font-weight:400;font-size:12px;margin-left:8px;}
.date{color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums;}
.date b{color:var(--gold);}
.layout{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:minmax(0,490px) 1fr;gap:18px;align-items:start;}
@media(max-width:800px){.layout{grid-template-columns:1fr;}}
/* 건물 이미지 자체가 무대 크기를 정의 → 스프라이트가 이미지에 정확히 고정 */
.stage{position:relative;width:100%;border-radius:14px;overflow:hidden;box-shadow:0 26px 70px rgba(0,0,0,.6);background:#0b0d13;font-size:0;}
.building{position:relative;display:block;width:100%;height:auto;z-index:1;}
.emp{position:absolute;transform:translateX(-50%);z-index:2;pointer-events:none;transition:left 1.4s ease-in-out, bottom 1.8s ease-in-out;}
.emp img{width:100%;height:auto;display:block;filter:drop-shadow(0 4px 5px rgba(0,0,0,.4));}
.furni{position:absolute;transform:translateX(-50%);z-index:3;pointer-events:none;}
.furni img{width:100%;height:100%;display:block;object-fit:fill;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3));}
.bubble{position:absolute;transform:translateX(-50%);background:#fbf6ec;color:#2a2015;font-size:7.5px;line-height:1.22;font-weight:600;border-radius:7px;padding:2px 5px;width:max-content;max-width:82px;box-shadow:0 2px 6px rgba(0,0,0,.4);z-index:6;text-align:center;transition:left 1.4s ease-in-out, bottom 1.8s ease-in-out;}
.bubble:after{content:'';position:absolute;left:50%;top:100%;transform:translateX(-50%);border:4px solid transparent;border-top-color:#fbf6ec;}
.floortag{position:absolute;left:6px;transform:translateY(-50%);background:rgba(23,16,10,.82);color:var(--gold);font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;z-index:4;letter-spacing:.02em;pointer-events:none;}
.side{display:flex;flex-direction:column;gap:14px;}
.card{background:var(--wall2);border:1px solid #52412c;border-radius:12px;padding:15px 16px;}
.card h3{font-size:14px;color:var(--gold);margin-bottom:9px;}
.script{font-size:13.5px;line-height:1.8;white-space:pre-line;}
.roster{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.rc{display:flex;gap:8px;align-items:flex-start;font-size:12px;}
.rc .dot{width:26px;height:26px;border-radius:50%;overflow:hidden;flex:none;background:#2a2015;border:1.5px solid #6a583c;margin-top:2px;}
.rc .dot img{width:100%;height:100%;object-fit:cover;object-position:top;}
.rc .rn{font-weight:700;}
.rc .rr{color:var(--dim);font-size:10.5px;}
.rc .rh{color:#8a7a5c;font-size:9.5px;margin-top:1px;font-variant-numeric:tabular-nums;}
.feed .row{display:block;padding:9px 12px;margin-bottom:7px;border-radius:9px;background:rgba(224,184,120,.055);border-left:3px solid rgba(224,184,120,.5);line-height:1.5;}
.feed .row:last-child{margin-bottom:0;}
.feed .row .meta{display:flex;gap:7px;align-items:center;margin-bottom:3px;}
.feed .tm{color:var(--dim);font-size:11.5px;white-space:nowrap;font-variant-numeric:tabular-nums;}
.feed .wn{color:#2a1c10;background:var(--coral);padding:1px 9px;border-radius:9px;font-size:11px;font-weight:800;white-space:nowrap;letter-spacing:-.01em;}
.feed .msg{color:var(--txt);font-size:14px;}
.foot{max-width:1000px;margin:22px auto 0;color:var(--dim);font-size:12px;text-align:center;line-height:1.85;}
</style>
</head>
<body>
<nav style="max-width:1000px;margin:0 auto 12px;display:flex;gap:7px;flex-wrap:wrap;justify-content:center;">
  <a href="/" style="color:var(--txt);text-decoration:none;border:1px solid var(--wall2);border-radius:14px;padding:4px 11px;font-size:12.5px;background:rgba(255,255,255,.05);">✻ 홈</a>
  <a href="/search/" style="color:var(--txt);text-decoration:none;border:1px solid var(--wall2);border-radius:14px;padding:4px 11px;font-size:12.5px;background:rgba(255,255,255,.05);">🔎 검색</a>
  <a href="/tools/" style="color:var(--txt);text-decoration:none;border:1px solid var(--wall2);border-radius:14px;padding:4px 11px;font-size:12.5px;background:rgba(255,255,255,.05);">🧰 도구방</a>
  <a href="/games/" style="color:var(--txt);text-decoration:none;border:1px solid var(--wall2);border-radius:14px;padding:4px 11px;font-size:12.5px;background:rgba(255,255,255,.05);">🎮 게임방</a>
  <a href="/tests/" style="color:var(--txt);text-decoration:none;border:1px solid var(--wall2);border-radius:14px;padding:4px 11px;font-size:12.5px;background:rgba(255,255,255,.05);">🧠 심리테스트</a>
  <a href="/page/requests/" style="color:var(--txt);text-decoration:none;border:1px solid var(--wall2);border-radius:14px;padding:4px 11px;font-size:12.5px;background:rgba(255,255,255,.05);">💌 요청방</a>
  <a href="/categories/뉴스/" style="color:var(--txt);text-decoration:none;border:1px solid var(--wall2);border-radius:14px;padding:4px 11px;font-size:12.5px;background:rgba(255,255,255,.05);">📰 뉴스</a>
  <a href="/darak-company/" style="color:#17100a;text-decoration:none;border:1px solid var(--gold);border-radius:14px;padding:4px 11px;font-size:12.5px;background:var(--gold);font-weight:700;">🏢 다락방컴퍼니</a>
  <a href="/darak-company/production.html" style="color:var(--txt);text-decoration:none;border:1px solid var(--wall2);border-radius:14px;padding:4px 11px;font-size:12.5px;background:rgba(255,255,255,.05);">🎬 제작노트</a>
  <a href="/darak-company/characters.html" style="color:var(--txt);text-decoration:none;border:1px solid var(--wall2);border-radius:14px;padding:4px 11px;font-size:12.5px;background:rgba(255,255,255,.05);">🏛 인물도감</a>
</nav>
<div class="top">
  <div class="brand">🏠 다락방 컴퍼니 <small>AI 직원들의 하루</small></div>
  <div class="date" id="date"></div>
</div>
<div class="layout">
  <div class="stage" id="stage">
    <img class="building" src="chars/bldg6.png?v=3" alt="다락방 컴퍼니 사옥">

    <div class="card feed"><h3>🕑 작업 로그 (전일 기록·실시간 재생)</h3><div id="feed"></div></div>
  </div>
</div>
<div class="arc" style="max-width:1000px;margin:30px auto 0;">
  <h3 style="color:var(--gold);font-size:16px;margin-bottom:12px;text-align:center;">📚 지난 하루 기록 아카이브</h3>
  <div id="arclist" style="display:flex;flex-direction:column;gap:8px;max-width:700px;margin:0 auto;">불러오는 중…</div>
</div>
<div style="max-width:760px;margin:34px auto 0;padding:0 4px;">
  <h3 style="color:var(--gold);font-size:16px;margin-bottom:10px;text-align:center;">💬 방명록</h3>
  <div id="planfully-comments"></div>
  <script src="/comments.js?v=2" defer></script>
</div>
<div class="foot">
  <div>이 회사의 직원들은 실제로 매일 일하는 AI 에이전트예요. 어제 한 일을 각색해 보여드립니다 🤖</div>
  <div>구경만 가능 · 지시는 사장님만</div>
</div>
<script>
(function(){
  fetch('/darak-company/log-index.json?v='+Date.now()).then(function(r){return r.json();}).then(function(a){
    var el=document.getElementById('arclist');
    if(!a||!a.length){el.innerHTML='<div style="color:var(--dim);text-align:center;">아직 기록이 없어요.</div>';return;}
    el.innerHTML=a.slice(0,30).map(function(x){
      return '<a href="/darak-company-log/'+x.date+'/" style="display:block;color:var(--txt);text-decoration:none;border:1px solid var(--wall2);border-radius:10px;padding:11px 14px;background:rgba(255,255,255,.04);font-size:13.5px;">🗓 <b style="color:var(--gold);">'+x.date+'</b> — '+(x.title||'하루 기록')+'</a>';
    }).join('');
  }).catch(function(){document.getElementById('arclist').innerHTML='<a href="/darak-company-log/" style="color:var(--gold);text-align:center;display:block;">전체 기록 보기 →</a>';});
})();
</script>
<script>
var IMG={boss:'boss',hr:'seri',sec:'sec',jay:'jay',kook:'kook',coin:'coin',content:'trendy',pd:'pd',coach:'coach',lobby:'lobby'};
// 캐릭터 홈(발끝 좌표): x%, base(발끝 y frac), h(키 frac)
var CH={
 boss:{x:44,base:.26,h:.12}, hr:{x:27,base:.39,h:.115}, sec:{x:55,base:.39,h:.115},
 jay:{x:24,base:.52,h:.115}, kook:{x:41,base:.52,h:.115}, coin:{x:58,base:.52,h:.115},
 content:{x:17,base:.762,h:.11}, pd:{x:44,base:.762,h:.115},
 coach:{x:30,base:.88,h:.105}, lobby:{x:47,base:.648,h:.115}
};
// 책상+소품 (전경). base=바닥, dw/dh=책상 폭/높이(frac), prop/pw
var SCALE=0.8; var IN=.01, PA={laptopback:.527, monitorback:.635};
var FUR={
 boss:{x:44,base:.26,dw:.19,dh:.05,prop:'laptopback',pw:.05},
 hr:{x:27,base:.39,dw:.145,dh:.048,prop:'laptopback',pw:.045}, sec:{x:55,base:.39,dw:.145,dh:.048,prop:'laptopback',pw:.045},
 jay:{x:24,base:.52,dw:.13,dh:.048,prop:'monitorback',pw:.04}, kook:{x:41,base:.52,dw:.13,dh:.048,prop:'monitorback',pw:.04}, coin:{x:58,base:.52,dw:.14,dh:.048,prop:'monitorback',pw:.04},
 content:{x:17,base:.762,dw:.145,dh:.048,prop:'laptopback',pw:.045}, pd:{x:44,base:.762,dw:.155,dh:.048,prop:'laptopback',pw:.048}
};
var LABELS=[['🌿 옥상 정원',9],['대표실',22.5],['인사팀',36],['투자팀',47],['1층 로비',58.5],['지하1 · 콘텐츠팀',70.5],['지하2 · 헬스장',82],['지하3 · 서버실',93]];
function esc(s){return (s||'').replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function daysSince(d){var t=new Date(d+'T00:00:00+09:00');return Math.max(0,Math.floor((new Date()-t)/86400000));}

// ── 근무 스케줄 (KST · 분단위 · 요일) ──
function kstNow(){return new Date(Date.now()+ (new Date().getTimezoneOffset()+540)*60000);}
function nowMin(){var n=kstNow();return n.getHours()*60+n.getMinutes();}
function dowKST(){return kstNow().getDay();}   // 0=일 … 6=토
var HOLIDAYS_2026=['2026-01-01','2026-02-16','2026-02-17','2026-02-18','2026-03-01','2026-03-02','2026-05-05','2026-05-24','2026-05-25','2026-06-06','2026-07-17','2026-08-15','2026-08-17','2026-09-24','2026-09-25','2026-09-26','2026-09-28','2026-10-03','2026-10-05','2026-10-09','2026-12-25'];
function isHoliday(){return HOLIDAYS_2026.indexOf(kstNow().toISOString().slice(0,10))>=0;}
function isWeekend(){var w=dowKST();return w===0||w===6;}
function isMarketDay(){return !isWeekend() && !isHoliday();}
function inMin(m,a,b){return a<=b ? (m>=a&&m<b) : (m>=a||m<b);} // 자정 넘김 지원
// 장 present 구간(KST·분): 시작30분전~종료30분후.  국장 08:30-16:00
// 미장은 미 서머타임(3월2째주일~11월1째주일)에 22:00-05:30, 표준시엔 23:30-06:30 자동전환
var MKT={kr:[510,960]};
function nthSunday(y,mo,n){var d=new Date(Date.UTC(y,mo,1));return 1+((7-d.getUTCDay())%7)+(n-1)*7;}
function isUsDst(){var n=kstNow(),y=n.getFullYear(),mo=n.getMonth(),da=n.getDate();
 if(mo>2&&mo<10)return true; if(mo<2||mo>10)return false;
 if(mo===2)return da>=nthSunday(y,2,2); return da<nthSunday(y,10,1);}
function usWin(){return isUsDst()?[1320,330]:[1380,390];}
var BOSS_WEEK=[420,1380], BOSS_WKND=[510,570]; // 07:00-23:00 / 주말·공휴일 08:30-09:30
// 사장 운동: 월수금 12:00-12:30 · 화 20:00-20:50 · 일 14:00-14:50
var GYM=[{d:[1,3,5],w:[720,750]},{d:[2],w:[1200,1250]},{d:[0],w:[840,890]}];
// 'boss'=사장과 동행 / market=장 열린날 그 시간만 / always=24시간
var SCHED={boss:'boss',sec:'boss',content:'boss',hr:'boss',coach:'boss',
 lobby:{always:1},coin:{always:1},pd:{always:1},jay:{market:'us'},kook:{market:'kr'}};
function bossWin(){return (isWeekend()||isHoliday())?BOSS_WKND:BOSS_WEEK;}
function atGym(k){if(k!=='boss')return false;var m=nowMin(),w=dowKST();return GYM.some(function(g){return g.d.indexOf(w)>=0&&inMin(m,g.w[0],g.w[1]);});}
function isPresent(k){
 var s=SCHED[k]; if(!s)return true;
 if(s==='boss'){var inw=inMin(nowMin(),bossWin()[0],bossWin()[1]); return k==='boss'?(inw||atGym('boss')):inw;}
 if(s.always)return true;
 if(s.market){if(!isMarketDay())return false; var w=s.market==='us'?usWin():MKT.kr; return inMin(nowMin(),w[0],w[1]);}
 return true;
}
// 현재 위치(자리/헬스장). 사장 운동중엔 헬스장(코치 옆)
function curPos(k){var c=CH[k];if(k==='boss'&&atGym('boss'))return{x:34,base:.88,h:c.h};return c;}
function desiredLoc(k){if(!isPresent(k))return 'out'; if(k==='boss'&&atGym('boss'))return 'gym'; return 'in';}

function render(d){
 document.getElementById('date').innerHTML=d.date+' 기록 실시간 재생 · <b>'+(d.weather||'')+'</b>';
 document.getElementById('script').textContent=d.daily_script||'';
 var emps=d.employees||{};
 // 층 라벨
 document.getElementById('labels').innerHTML=LABELS.map(function(L){return '<span class="floortag" style="top:'+L[1]+'%">'+L[0]+'</span>';}).join('');
 // 책상+소품(전경)
 var fh='';
 Object.keys(FUR).forEach(function(k){var f=FUR[k];var deskTop=(f.base-IN)-f.dh*SCALE;
  fh+='<div class="furni" style="left:'+f.x+'%;bottom:'+((1-(f.base-IN))*100)+'%;width:'+(f.dw*SCALE*100)+'%;height:'+(f.dh*SCALE*100)+'%"><img src="chars/desk_solid_cut.png?v=3" alt=""></div>';
  if(f.prop)fh+='<div class="furni" style="left:'+f.x+'%;bottom:'+((1-(deskTop+.004))*100)+'%;width:'+(f.pw*SCALE*100)+'%;height:'+(f.pw*SCALE*PA[f.prop]*100)+'%"><img src="chars/'+f.prop+'_cut.png?v=3" alt=""></div>';
 });
 document.getElementById('furni').innerHTML=fh;
 // 캐릭터 무대 (최초 1회 생성, 이후 위치/출퇴근 이동은 tick가 관리)
 ensureStage(emps);
 // 명단
 document.getElementById('roster').innerHTML=Object.keys(CH).map(function(k){var e=emps[k];if(!e)return '';var img=IMG[k]||k;
  var hire=e.hire?'<div class="rh">🗓 '+e.hire+' 입사 · D+'+daysSince(e.hire)+'</div>':'';
  var away=atGym(k)?' <span style="color:#a6d49a">· 운동중</span>':(isPresent(k)?'':(SCHED[k]&&SCHED[k].market?' <span style="color:#8a6a4a">· 장마감·퇴근</span>':' <span style="color:#8a6a4a">· 퇴근</span>'));
  return '<div class="rc" style="'+(isPresent(k)?'':'opacity:.55')+'"><div class="dot"><img src="chars/'+img+'_cut.png?v=3" alt=""></div><div><div class="rn">'+esc(e.name)+'</div><div class="rr">'+esc(e.role)+away+'</div>'+hire+'</div></div>';}).join('');
 // 타임라인(어제 로그를 오늘 시각으로 재생 — 지난 것만, 최신이 위)
 renderFeed();
}
function hhmmNow(){var n=kstNow();return ('0'+n.getHours()).slice(-2)+':'+('0'+n.getMinutes()).slice(-2);}
function renderFeed(){
 if(!CUR)return;
 var emps=CUR.employees||{},now=hhmmNow();
 var past=(CUR.timeline||[]).filter(function(t){return t.t<=now;});
 var html=past.slice().reverse().map(function(t,i){
  var who=emps[t.who]?emps[t.who].name:t.who;
  return '<div class="row"'+(i===0?' style="border-left-color:var(--gold);background:rgba(255,220,140,.11)"':'')+'><div class="meta"><span class="wn">'+esc(who)+'</span><span class="tm">'+t.t+'</span></div><div class="msg">'+esc(t.msg)+'</div></div>';
 }).join('');
 var rest=(CUR.timeline||[]).length-past.length;
 if(rest>0)html+='<div class="row" style="opacity:.4;border-left-color:var(--dim)"><div class="msg">⏳ 이후 일정 '+rest+'건 대기 중…</div></div>';
 if(!past.length&&!rest)html='<div class="row"><span>기록된 로그가 없어요.</span></div>';
 document.getElementById('feed').innerHTML=html;
}
// 캐릭터 폭%: 실제 컷 비율(h*1.5*aspect)
var CHAR_ASPECT={boss:.434,hr:.451,sec:.474,jay:.442,kook:.414,coin:.567,content:.601,pd:.513,coach:.589,lobby:.502};
function charW(k){return (CH[k].h*SCALE*(1536/1024)*(CHAR_ASPECT[k]||.48))*100;}
// ── 무대(캐릭터/말풍선) 1회 생성 후 위치만 갱신 ──
var CUR=null, busy=false, built=false, CHKEYS=Object.keys(CH);
var LOC={}, ELEVX=73, OFF={x:-16,base:.648};   // 엘베 통로(사용자 지정 73) · 화면밖(1층 높이)
function empEl(k){return document.getElementById('emp-'+k);}
function bubEl(k){return document.getElementById('bub-'+k);}
function wait(ms){return new Promise(function(r){setTimeout(r,ms);});}
function place(k,x,base,anim){
 var e=empEl(k),b=bubEl(k),h=CH[k].h; if(!e)return;
 var tr=anim?'left 1.6s ease-in-out, bottom 1.6s ease-in-out, opacity .5s':'none';
 e.style.transition=tr; e.style.left=x+'%'; e.style.bottom=((1-base)*100)+'%';
 if(b){b.style.transition=tr; b.style.left=x+'%'; b.style.bottom=((1-(base-h))*100+1)+'%';}
}
function ensureStage(emps){
 if(built)return;
 var ch='',bh='';
 CHKEYS.forEach(function(k){var img=IMG[k]||k,nm=(emps[k]&&emps[k].name)||k;
  ch+='<div class="emp" id="emp-'+k+'" style="width:'+charW(k)+'%"><img src="chars/'+img+'_cut.png?v=3" alt="'+esc(nm)+'"></div>';
  bh+='<div class="bubble" id="bub-'+k+'" style="display:none"></div>';});
 document.getElementById('chars').innerHTML=ch;
 document.getElementById('bubbles').innerHTML=bh;
 built=true;
 CHKEYS.forEach(function(k){var d=desiredLoc(k); LOC[k]=d;
  var p=(d==='out')?OFF:curPos(k); place(k,p.x,p.base,false);
  empEl(k).style.opacity=(d==='out')?0:1;});
}
function setBub(k,txt){var b=bubEl(k);if(b){b.textContent=txt;b.style.display='';}}
function hideBub(k){var b=bubEl(k);if(b)b.style.display='none';}

// ── 출퇴근/운동 이동 (엘베 경유) ──
function seatOf(k){return LOC[k]==='gym'?{x:34,base:.88}:CH[k];}
async function walkOut(k){                 // 자리→(수평)엘베→(수직)1층→(수평)화면밖
 var s=seatOf(k);
 setBub(k,'수고하세요~'); await wait(800);
 place(k,ELEVX,s.base,true); await wait(1700);
 place(k,ELEVX,OFF.base,true); await wait(1700);
 hideBub(k); place(k,OFF.x,OFF.base,true); empEl(k).style.opacity=0; await wait(1700);
}
async function walkIn(k){                  // 화면밖→(수평)1층엘베→(수직)해당층→(수평)자리
 var s=CH[k];
 place(k,OFF.x,OFF.base,false); empEl(k).style.opacity=0; await wait(60);
 empEl(k).style.opacity=1;
 place(k,ELEVX,OFF.base,true); await wait(1700);
 place(k,ELEVX,s.base,true); await wait(1700);
 place(k,s.x,s.base,true); await wait(1600);
 setBub(k,'출근했습니다!'); await wait(1100); hideBub(k);
}
async function walkGym(going){             // 사장 자리↔헬스장
 var s=CH.boss, g={x:34,base:.88};
 if(going){ setBub('boss','운동 좀 하고 오지'); await wait(800);
  place('boss',ELEVX,s.base,true); await wait(1600);
  place('boss',ELEVX,g.base,true); await wait(1600);
  place('boss',g.x,g.base,true); await wait(1500); hideBub('boss');
 } else {
  place('boss',ELEVX,g.base,true); await wait(1600);
  place('boss',ELEVX,s.base,true); await wait(1600);
  place('boss',s.x,s.base,true); await wait(1500);
 }
}
async function tick(){
 if(busy||!CUR||!built)return;
 for(var i=0;i<CHKEYS.length;i++){var k=CHKEYS[i], d=desiredLoc(k), cur=LOC[k];
  if(d===cur)continue;
  busy=true;
  try{
   if(d==='out') await walkOut(k);
   else if(d==='gym') await walkGym(true);
   else if(cur==='gym') await walkGym(false);
   else await walkIn(k);
   LOC[k]=d;
  }catch(e){}
  busy=false; return;
 }
}
// 연출용 랜덤: 5초마다 10% 확률로 가벼운 대표실 보고 (2026-07-22 사용자 지정)
function ambientTick(){
 if(busy||!CUR||!built)return;
 if(Math.random()<0.10) reportScene();
}

// ── 일 받으면 갑자기 출근: 부재중이어도 실제 일한 봇이 잠깐 나와 처리하고 퇴근 ──
// 이미 지난(t<=지금) 이벤트만 — 재생 전 미리 말하지 않는다
function pastEventsFor(k){
 if(!CUR||!CUR.timeline)return [];
 var now=hhmmNow();
 return CUR.timeline.filter(function(t){return t.who===k&&t.msg&&t.t<=now;});
}
function eventMsgFor(k){
 var evs=pastEventsFor(k);
 if(!evs.length)return null;
 var e=Math.random()<0.5?evs[evs.length-1]:evs[(Math.random()*evs.length)|0];
 return e.line||e.msg;
}
async function surpriseVisit(k,text){
 if(busy||!CUR)return;
 if(!k){ // 랜덤 호출(과거 이벤트 있는 부재자)
  var cands=CHKEYS.filter(function(c){return c!=='boss'&&LOC[c]==='out'&&pastEventsFor(c).length;});
  if(!cands.length)return;
  k=cands[(Math.random()*cands.length)|0]; text=eventMsgFor(k);
 }
 busy=true;
 try{
  await walkIn(k);                       // 갑자기 출근(엘베 경유)
  setBub(k,'급한 일이 있어서…'); await wait(1200);
  setBub(k,text); await wait(3600);      // 실제 한 일 표시
  setBub(k,'처리 완료, 이만 가보겠습니다'); await wait(1500);
  await walkOut(k);                      // 다시 퇴근
  hideBub(k);
 }catch(e){}
 busy=false;                             // LOC[k]는 여전히 'out'
}

// ── 실시간 재생: 어제 그 시각의 로그가 지금 도착하면 그 직원이 말한다 ──
var PLAYED={}, playInit=false;
function evKey(e,i){return CUR.date+'|'+i+'|'+e.t+'|'+e.who;}
function initPlayed(){ // 첫 로드: 이미 지난 이벤트/보고는 완료로 간주(폭주 방지)
 var now=hhmmNow();
 (CUR.timeline||[]).forEach(function(e,i){if(e.t<=now)PLAYED[evKey(e,i)]=1;});
 REPORT_AT.forEach(function(r){if(r.t<=now)REPORTED[CUR.date+'|'+r.t+'|'+r.k]=1;});
 playInit=true;
}
async function playbackTick(){
 if(!CUR||!built)return;
 if(!playInit){initPlayed();return;}
 renderFeed();
 if(busy)return;
 var now=hhmmNow();
 var due=[];
 (CUR.timeline||[]).forEach(function(e,i){
  if(e.t<=now&&!PLAYED[evKey(e,i)])due.push([e,i]);
 });
 if(!due.length)return;
 var e=due[0][0]; PLAYED[evKey(due[0][0],due[0][1])]=1;
 var k=e.who, text=e.line||e.msg;
 if(!empEl(k))return;
 if(LOC[k]==='in'||LOC[k]==='gym'){
  busy=true;
  try{ setBub(k,text); await wait(7000); hideBub(k); }catch(err){}
  busy=false;
 }else if(LOC[k]==='out'){
  await surpriseVisit(k,text);
 }
}

// ── 대표실 보고 ──
// 사장 반응은 성과(mood)에 따라 다르게 (2026-07-22 피드백)
var BOSS_GOOD=['그래, 고생했다 👍','좋아, 계속 그렇게','오, 잘했네!','수고했다. 다음도 부탁해'];
var BOSS_BAD=['음… 원인 정리해서 보고해','리스크 관리부터 다시 보자','아쉽네. 내일 만회하자','손실 요인 분석해 두게','무리한 진입은 없었나?'];
var BOSS_NEUT=['그래, 꾸준함이 실력이다','무리하지 말고 가자','알겠다, 계속 지켜보자','현상 유지도 전략이지'];
function bossReplyFor(key){var m=((CUR.employees||{})[key]||{}).mood||'neutral';
 var pool=(m==='bad'||m==='anxious')?BOSS_BAD:((m==='good'||m==='hyper')?BOSS_GOOD:BOSS_NEUT);
 return pool[(Math.random()*pool.length)|0];}
function reportLine(key){var e=CUR.employees[key]||{};return (e.role||'')+' 보고 — '+(e.status||'이상 없습니다');}
async function doReport(key,intro){ // busy=true 상태에서 호출. 자리→대표실→보고→복귀
 var e=empEl(key),b=bubEl(key),home=CH[key],bossB=bubEl('boss');
 e.style.zIndex=7; if(b)b.style.zIndex=8;
 setBub(key,intro||'사장님, 보고하러 왔습니다!'); await wait(500);
 place(key,ELEVX,home.base,true); await wait(1500);
 place(key,ELEVX,0.26,true);      await wait(1800);
 place(key,53,0.26,true);         await wait(1500);
 setBub(key,reportLine(key)); if(bossB){bossB.textContent=bossReplyFor(key);bossB.style.display='';}
 await wait(3200);
 place(key,ELEVX,0.26,true);      await wait(1500);
 place(key,ELEVX,home.base,true); await wait(1800);
 place(key,home.x,home.base,true);await wait(1500);
 hideBub(key); if(bossB)bossB.style.display='none';
 e.style.zIndex=2; if(b)b.style.zIndex=6;
}
async function reportScene(){
 if(busy||!CUR||LOC.boss!=='in')return;
 var pool=CHKEYS.filter(function(k){return k!=='boss'&&LOC[k]==='in'&&CUR.employees[k];});
 if(!pool.length)return; var key=pool[(Math.random()*pool.length)|0];
 busy=true;
 try{ await doReport(key); }catch(e){}
 busy=false;
}

// ── 장 마감 업무보고: 각 트레이더가 마감 시각에 사장께 당일 보고 (2026-07-22 피드백) ──
var REPORT_AT=[
 {t:'07:10',k:'jay', mkt:1, intro:'사장님, 미장 마감 보고입니다'},
 {t:'09:05',k:'coin',       intro:'일일 정산 보고 왔습니다!'},
 {t:'15:35',k:'kook',mkt:1, intro:'국장 마감 보고 드립니다'}];
var REPORTED={};
async function reportTick(){
 if(busy||!CUR||!built||!playInit)return;
 if(LOC.boss!=='in')return;
 var now=hhmmNow();
 for(var i=0;i<REPORT_AT.length;i++){var r=REPORT_AT[i],key=CUR.date+'|'+r.t+'|'+r.k;
  if(r.t<=now&&!REPORTED[key]){
   REPORTED[key]=1;
   if(!CUR.employees[r.k])return;
   if(r.mkt&&!isMarketDay())return; // 휴장일엔 장 마감 보고 없음
   busy=true;
   try{
    var wasOut=(LOC[r.k]==='out');
    if(wasOut){await walkIn(r.k);}
    await doReport(r.k,r.intro);
    if(wasOut){await walkOut(r.k);}
   }catch(e){}
   busy=false; return;
  }
 }
}

function pickText(k){var e=(CUR.employees||{})[k]||{},w=e.bubble,id=IDLE[k]||IDLE._def;
 var ev=eventMsgFor(k),r=Math.random();
 if(ev&&r<0.28)return ev;         // 실제 한 일
 if(w&&r<0.55)return w;           // 오늘의 한마디
 return id[(Math.random()*id.length)|0];}  // 혼잣말
var bubIdx=0;
function rotateBubbles(){
 if(busy||!CUR||!built)return;
 var keys=CHKEYS.filter(function(k){return LOC[k]==='in'||LOC[k]==='gym';});
 CHKEYS.forEach(function(k){if(keys.indexOf(k)<0)hideBub(k);});
 // 말풍선은 상시가 아님 — 조용할 때도(0명) 있고, 최대 2명 순차
 var r=Math.random();
 var n = r<0.4 ? 0 : (r<0.72 ? 1 : 2);   // 40% 조용 · 32% 1명 · 28% 2명
 var show={};
 for(var i=0;i<Math.min(n,keys.length);i++){show[keys[(bubIdx+i)%keys.length]]=1;}
 if(keys.length&&n>0) bubIdx=(bubIdx+n)%keys.length;
 keys.forEach(function(k){var b=bubEl(k);if(!b)return; if(show[k]){b.textContent=pickText(k);b.style.display='';}else b.style.display='none';});
}

function load(){fetch('company.json?v='+Date.now()).then(function(r){return r.json();}).then(function(d){
 if(CUR&&CUR.date!==d.date){PLAYED={};REPORTED={};playInit=false;} // 자정 넘어 새 로그로 교체되면 재생상태 리셋
 CUR=d;render(d);}).catch(function(){document.getElementById('script').textContent='데이터를 불러오지 못했어요.';});}
load();setInterval(load,60000);
setInterval(tick,3000);
setInterval(ambientTick,5000);
setInterval(rotateBubbles,4500);
setInterval(playbackTick,8000);
setInterval(reportTick,20000);
