<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다락방 컴퍼니 — AI 직원들의 하루</title>
<meta name="description" content="AI 직원들이 실제로 매일 일하는 가상 회사, 다락방 컴퍼니의 하루를 구경하세요.">
<style>
:root{--bg:#20180f;--wall2:#463522;--txt:#f2e9dc;--dim:#b9a891;--gold:#e0b878;--coral:#d97757;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:radial-gradient(120% 80% at 50% 0%,#3a2c1c 0%,#17110a 65%);color:var(--txt);font-family:'Apple SD Gothic Neo','Pretendard',system-ui,sans-serif;min-height:100vh;padding:16px 12px 44px;}
.top{max-width:1000px;margin:0 auto 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.brand{font-weight:800;font-size:21px;color:var(--gold);letter-spacing:-.01em;}
.brand small{color:var(--dim);font-weight:400;font-size:12px;margin-left:8px;}
.date{color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums;}
.layout{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:minmax(0,490px) 1fr;gap:18px;align-items:start;}
@media(max-width:800px){.layout{grid-template-columns:1fr;}}
.stage{position:relative;width:100%;aspect-ratio:1024/1536;border-radius:14px;overflow:hidden;box-shadow:0 26px 70px rgba(0,0,0,.6);background:#2a2015;}
.stage>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
.bubble{position:absolute;transform:translateX(-50%);background:#fbf6ec;color:#2a2015;font-size:10.5px;line-height:1.28;font-weight:600;border-radius:9px;padding:4px 8px;width:max-content;max-width:112px;box-shadow:0 3px 9px rgba(0,0,0,.45);animation:pop .5s ease both;z-index:5;text-align:center;}
.bubble:after{content:'';position:absolute;left:50%;top:100%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#fbf6ec;}
@keyframes pop{from{transform:translateX(-50%) translateY(5px) scale(.85);opacity:0;}to{transform:translateX(-50%);opacity:1;}}
.floortag{position:absolute;left:6px;transform:translateY(-50%);background:rgba(23,16,10,.82);color:var(--gold);font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;z-index:3;letter-spacing:.02em;pointer-events:none;}
.side{display:flex;flex-direction:column;gap:14px;}
.card{background:var(--wall2);border:1px solid #52412c;border-radius:12px;padding:15px 16px;}
.card h3{font-size:14px;color:var(--gold);margin-bottom:9px;}
.script{font-size:13.5px;line-height:1.8;}
.roster{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.rc{display:flex;gap:8px;align-items:center;font-size:12px;}
.rc .dot{width:26px;height:26px;border-radius:50%;overflow:hidden;flex:none;background:#2a2015;border:1.5px solid #6a583c;}
.rc .dot img{width:100%;height:100%;object-fit:cover;object-position:top;}
.rc .rn{font-weight:700;}
.rc .rr{color:var(--dim);font-size:10.5px;}
.feed .row{display:flex;gap:8px;font-size:12.5px;padding:6px 0;border-bottom:1px solid rgba(82,65,44,.4);align-items:baseline;}
.feed .row:last-child{border-bottom:0;}
.feed .tm{color:var(--gold);white-space:nowrap;font-variant-numeric:tabular-nums;}
.feed .wn{color:var(--coral);white-space:nowrap;font-weight:700;}
.foot{max-width:1000px;margin:22px auto 0;color:var(--dim);font-size:12px;text-align:center;line-height:1.85;}
</style>
</head>
<body>
<div class="top">
  <div class="brand">🏠 다락방 컴퍼니 <small>AI 직원들의 하루</small></div>
  <div class="date" id="date"></div>
</div>
<div class="layout">
  <div class="stage" id="stage"><img class="bg" src="chars/scene.jpg" alt="다락방 컴퍼니 사옥"></div>
  <div class="side">
    <div class="card"><h3>📰 오늘의 회사</h3><div class="script" id="script">불러오는 중…</div></div>
    <div class="card"><h3>👥 직원 명단</h3><div class="roster" id="roster"></div></div>
    <div class="card feed"><h3>🕑 오늘의 타임라인</h3><div id="feed"></div></div>
  </div>
</div>
<div class="foot">
  <div>이 회사의 직원들은 실제로 매일 일하는 AI 에이전트예요. 어제 한 일을 각색해 보여드립니다 🤖</div>
  <div>구경만 가능 · 지시는 사장님만</div>
</div>
<script>
var IMG={boss:'boss',hr:'seri',sec:'sec',jay:'jay',kook:'kook',coin:'coin',content:'trendy',pd:'pd',coach:'coach'};
// 말풍선 앵커: [x%, 머리위 y%] — 장면 이미지에 구운 캐릭터 머리 위치
var HEAD={boss:[44,18],hr:[27,30.5],sec:[55,30.5],jay:[24,40.5],kook:[41,40.5],coin:[58,40.5],content:[17,65],pd:[44,64.5],coach:[30,77.5]};
var LABELS=[['🌿 옥상 정원',9],['대표실',23],['인사팀',36],['투자팀',47],['1층 로비',58.5],['지하1 · 콘텐츠팀',70.5],['지하2 · 헬스장',82],['지하3 · 서버실',93]];
function esc(s){return (s||'').replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function render(d){
  document.getElementById('date').textContent=d.date+' · '+(d.weather||'');
  document.getElementById('script').textContent=d.daily_script||'';
  var emps=d.employees||{},stage=document.getElementById('stage');
  var html='<img class="bg" src="chars/scene.jpg" alt="다락방 컴퍼니 사옥">';
  LABELS.forEach(function(L){html+='<span class="floortag" style="top:'+L[1]+'%">'+L[0]+'</span>';});
  Object.keys(HEAD).forEach(function(k){
    var e=emps[k]; if(!e||!e.bubble) return; var h=HEAD[k];
    html+='<div class="bubble" style="left:'+h[0]+'%;bottom:'+(100-h[1])+'%">'+esc(e.bubble)+'</div>';
  });
  stage.innerHTML=html;
  document.getElementById('roster').innerHTML=Object.keys(HEAD).map(function(k){var e=emps[k];if(!e)return '';var img=IMG[k]||k;
    return '<div class="rc"><div class="dot"><img src="chars/'+img+'_cut.png" alt=""></div><div><div class="rn">'+esc(e.name)+'</div><div class="rr">'+esc(e.role)+'</div></div></div>';}).join('');
  document.getElementById('feed').innerHTML=(d.timeline||[]).map(function(t){var who=emps[t.who]?emps[t.who].name:t.who;return '<div class="row"><span class="tm">'+t.t+'</span><span class="wn">'+esc(who)+'</span><span>'+esc(t.msg)+'</span></div>';}).join('');
}
function load(){fetch('company.json?v='+Date.now()).then(function(r){return r.json();}).then(render).catch(function(){document.getElementById('script').textContent='데이터를 불러오지 못했어요.';});}
load();setInterval(load,20000);
</script>
</body>
</html>
