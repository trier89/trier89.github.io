<script>
(function(){
// ─────────────────────────────────────────────────────────────
// 내장 퍼즐 (오리지널 창작 — 기존 퍼즐 베끼기 금지)
//  · answer 는 한글 음절 문자열, 각 음절이 한 칸.
//  · 좌표/교차는 scratchpad/verify2.py 로 사전 검증(모든 연속 칸이 실제 단어,
//    충돌·비한글 음절 없음, 번호 자동 계산과 일치).
//  · level: 쉬움 / 보통 / 어려움  → 상단 난이도 필터.
// ─────────────────────────────────────────────────────────────
var PUZZLES=[
  // ── 쉬움 ── 3글자 낱말 계단 (5x5)
  { id:'e1', name:'나물과 악기', level:'쉬움', rows:5, cols:5,
    across:[
      {r:0,c:0,answer:'도라지',clue:'산에서 캐는 쌉싸름한 나물, "~ 백도라지" 노래 속 그 뿌리'},
      {r:2,c:2,answer:'개구리',clue:'올챙이가 뒷다리부터 자라서 되는, 개굴개굴 우는 것'}
    ],
    down:[
      {r:0,c:2,answer:'지우개',clue:'연필의 실수를 없던 일로 만들어 주는 물건'},
      {r:2,c:4,answer:'리코더',clue:'초등학교 음악시간 단골, 구멍 막아 부는 관악기'}
    ] },

  // ── 보통 ── 3글자 상식 계단 (5x7)
  { id:'m1', name:'도시 나들이', level:'보통', rows:5, cols:7,
    across:[
      {r:0,c:0,answer:'도서관',clue:'"조용히 하세요" — 책이 잠자는 집'},
      {r:2,c:2,answer:'지하철',clue:'땅속을 달리는 대중교통, 몇 호선 타세요?'},
      {r:4,c:4,answer:'자전거',clue:'페달을 밟아야 넘어지지 않는 두 바퀴'}
    ],
    down:[
      {r:0,c:2,answer:'관광지',clue:'여행 가면 사진부터 찍게 되는 명소'},
      {r:2,c:4,answer:'철학자',clue:'"나는 생각한다, 고로 존재한다"를 업으로 삼는 사람'}
    ] },

  { id:'m2', name:'주방 소동', level:'보통', rows:5, cols:7,
    across:[
      {r:0,c:0,answer:'냉장고',clue:'문 자주 열면 혼나는, 음식이 사는 차가운 집'},
      {r:2,c:2,answer:'마술사',clue:'비둘기와 카드로 눈을 속이는 사람'},
      {r:4,c:4,answer:'다람쥐',clue:'볼주머니에 도토리 가득, 쳇바퀴의 주인공'}
    ],
    down:[
      {r:0,c:2,answer:'고구마',clue:'군것질로 굽거나 쪄 먹는 뿌리 — 답답한 사람 별명이기도'},
      {r:2,c:4,answer:'사이다',clue:'위 세로 낱말을 먹고 답답할 때 찾게 되는 톡 쏘는 음료'}
    ] },

  // ── 어려움 ── 사자성어+상식 조밀 인터록 (5x8, 8교차)
  { id:'h1', name:'변방 노인의 말(馬)', level:'어려움', rows:5, cols:8,
    across:[
      {r:0,c:0,answer:'양파',clue:'까도 까도 속을 모르겠고, 썰면 눈물 나는 채소'},
      {r:0,c:3,answer:'아리랑',clue:'고개를 넘어가는, 세계가 아는 우리 민요'},
      {r:2,c:1,answer:'새옹지마',clue:'변방 노인의 말(馬) 이야기 — 인생 길흉화복은 알 수 없다는 사자성어'},
      {r:4,c:4,answer:'크레파스',clue:'도화지에 문질러 색칠하는, 크레용의 사촌'}
    ],
    down:[
      {r:0,c:1,answer:'파랑새',clue:'멀리서 찾아 헤맸지만 결국 집에 있었다는 동화 속 파란 새'},
      {r:0,c:3,answer:'아버지',clue:'심심하게 풀면 "어머니의 배우자"'},
      {r:2,c:2,answer:'옹달샘',clue:'깊은 산속 작고 맑은 샘, 토끼가 세수하러 온다는'},
      {r:2,c:4,answer:'마이크',clue:'노래방에서 좀처럼 놓지 않는, 소리를 키워 주는 그것'},
      {r:3,c:6,answer:'대파',clue:'라면에 송송, 국물맛 내는 기다란 파'}
    ] },

  // ── 어려움 ── 사자성어+전통/역사 상식 계단 (5x8)
  { id:'h2', name:'돌 하나에 새 두 마리', level:'어려움', rows:5, cols:8,
    across:[
      {r:0,c:0,answer:'일석이조',clue:'돌 하나로 새 두 마리 — 한 번에 두 이득을 보는 사자성어'},
      {r:2,c:3,answer:'가야금',clue:'열두 줄을 뜯어 소리 내는 우리 전통 현악기'},
      {r:4,c:5,answer:'탑승객',clue:'비행기·버스에 올라탄 손님'}
    ],
    down:[
      {r:0,c:3,answer:'조각가',clue:'돌·나무를 깎아 작품을 빚는 예술가 (로댕이 대표)'},
      {r:2,c:5,answer:'금자탑',clue:'"金"자처럼 쌓아 올린, 후세에 남을 위대한 업적'}
    ] }
];

// ── DOM ──
var boardEl=document.getElementById('board'),
    cluesEl=document.getElementById('clues'),
    pselEl=document.getElementById('psel'),
    lvlEl=document.getElementById('lvl'),
    curEl=document.getElementById('cur'),
    msgEl=document.getElementById('msg'),
    timerEl=document.getElementById('timer');

// ── 상태 ──
var P, grid, cells, words, cellNum, active, cleared, curIdx=0,
    t0=0, tick=null, running=false;

function isSyll(ch){ if(!ch)return false; var x=ch.charCodeAt(0); return x>=0xAC00&&x<=0xD7A3; }

// ── 난이도 필터 ──
var LEVELS=['전체','쉬움','보통','어려움'];
var LVCOLOR={'쉬움':'#7bbf7b','보통':'#e0c07e','어려움':'#d97757'};
var curLevel='전체';

function firstVisible(){ for(var i=0;i<PUZZLES.length;i++){ if(curLevel==='전체'||PUZZLES[i].level===curLevel) return i; } return 0; }

function buildLvl(){
  lvlEl.innerHTML='';
  LEVELS.forEach(function(lv){
    var b=document.createElement('button');
    b.textContent=lv;
    b.className=(lv===curLevel?'on':'');
    b.onclick=function(){ curLevel=lv; buildLvl(); buildPsel(); load(firstVisible()); };
    lvlEl.appendChild(b);
  });
}
function buildPsel(){
  pselEl.innerHTML='';
  PUZZLES.forEach(function(p,i){
    if(curLevel!=='전체' && p.level!==curLevel) return;
    var b=document.createElement('button');
    b.innerHTML=p.name+' <span style="color:'+(LVCOLOR[p.level]||'#9c9a94')+';font-size:11px;">'+p.level+'</span>';
    b.dataset.idx=i;
    b.style.borderLeft='3px solid '+(LVCOLOR[p.level]||'#3e3e3a');
    if(i===curIdx) b.className='on';
    b.onclick=function(){ load(i); };
    pselEl.appendChild(b);
  });
}
function highlightPsel(){
  [].forEach.call(pselEl.children,function(b){ b.classList.toggle('on', +b.dataset.idx===curIdx); });
}
buildLvl();

// ── 퍼즐 로드 ──
function load(idx){
  stopTimer(); running=false; t0=0; timerEl.textContent='0:00';
  curIdx=idx; P=PUZZLES[idx]; cleared=false; active=null;
  msgEl.textContent=''; curEl.innerHTML='칸이나 힌트를 골라 시작하세요.';

  // 정답 격자 + 검은칸 마스크 구성
  grid=[]; for(var r=0;r<P.rows;r++){ grid.push(new Array(P.cols).fill(null)); }
  words=[];
  function place(entry,dir){
    var w={dir:dir,r:entry.r,c:entry.c,answer:entry.answer,clue:entry.clue,cells:[]};
    for(var k=0;k<entry.answer.length;k++){
      var rr=entry.r+(dir==='down'?k:0), cc=entry.c+(dir==='across'?k:0);
      grid[rr][cc]=entry.answer[k];
      w.cells.push([rr,cc]);
    }
    words.push(w); return w;
  }
  (P.across||[]).forEach(function(e){ place(e,'across'); });
  (P.down||[]).forEach(function(e){ place(e,'down'); });

  // 번호 매기기(읽기 순서: 가로/세로 시작 칸)
  cellNum=[]; for(var r=0;r<P.rows;r++){ cellNum.push(new Array(P.cols).fill(0)); }
  var n=0;
  for(var r=0;r<P.rows;r++)for(var c=0;c<P.cols;c++){
    if(grid[r][c]===null) continue;
    var aStart=(c===0||grid[r][c-1]===null)&&(c+1<P.cols&&grid[r][c+1]!==null);
    var dStart=(r===0||grid[r-1][c]===null)&&(r+1<P.rows&&grid[r+1][c]!==null);
    if(aStart||dStart){ n++; cellNum[r][c]=n; }
  }
  // 단어에 번호 연결
  words.forEach(function(w){ w.num=cellNum[w.r][w.c]; });

  buildBoard();
  buildClues();
  buildPsel();
  highlightPsel();
}

function buildBoard(){
  boardEl.innerHTML='';
  boardEl.style.gridTemplateColumns='repeat('+P.cols+', auto)';
  cells=[]; for(var r=0;r<P.rows;r++){ cells.push(new Array(P.cols).fill(null)); }
  for(var r=0;r<P.rows;r++)for(var c=0;c<P.cols;c++){
    var d=document.createElement('div'); d.className='cell';
    if(grid[r][c]===null){ d.className='cell black'; boardEl.appendChild(d); continue; }
    if(cellNum[r][c]){ var s=document.createElement('span'); s.className='num'; s.textContent=cellNum[r][c]; d.appendChild(s); }
    var inp=document.createElement('input');
    inp.type='text'; inp.maxLength=1; inp.autocomplete='off'; inp.autocapitalize='off';
    inp.setAttribute('inputmode','text'); inp.setAttribute('aria-label','('+(r+1)+','+(c+1)+') 칸');
    inp.dataset.r=r; inp.dataset.c=c;
    bindInput(inp,r,c);
    d.appendChild(inp);
    cells[r][c]={el:d,inp:inp};
    boardEl.appendChild(d);
  }
}

// 한 칸 입력 처리(한글 IME 조합 대응)
function bindInput(inp,r,c){
  var composing=false;
  inp.addEventListener('focus',function(){ focusCell(r,c,false); });
  inp.addEventListener('mousedown',function(){
    // 이미 이 칸에 있으면 방향 전환
    if(active&&active.r===r&&active.c===c){ toggleDir(r,c); }
  });
  inp.addEventListener('compositionstart',function(){ composing=true; });
  inp.addEventListener('compositionend',function(e){ composing=false; handle(e.target.value); });
  inp.addEventListener('input',function(e){ if(!composing) handle(e.target.value); });
  inp.addEventListener('keydown',function(e){
    if(e.key==='Backspace'){
      if(inp.value===''){ e.preventDefault(); step(-1); }
      else { setWrong(r,c,false); markOk(r,c); }
    } else if(e.key==='ArrowRight'){ e.preventDefault(); move(r,c,0,1); }
    else if(e.key==='ArrowLeft'){ e.preventDefault(); move(r,c,0,-1); }
    else if(e.key==='ArrowDown'){ e.preventDefault(); move(r,c,1,0); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); move(r,c,-1,0); }
    else if(e.key==='Enter'){ e.preventDefault(); check(); }
  });
  function handle(v){
    if(cleared) return;
    startTimer();
    if(v.length>1){ v=v.slice(-1); inp.value=v; }
    setWrong(r,c,false);
    if(v===''){ return; }
    if(isSyll(v)){ inp.value=v; markOk(r,c); step(1); }
    else { inp.value=''; }   // 완성된 한글 음절만 허용
  }
}

function markOk(r,c){ /* 정답확인 전에는 색 표시 안 함(자리표시만) */ }

// 활성 칸/방향
function focusCell(r,c,doFocus){
  if(!cells[r]||!cells[r][c]) return;
  var dir=(active&&active.dir)?active.dir:'across';
  // 그 방향 단어가 없으면 다른 방향
  if(!wordAt(r,c,dir)) dir=(dir==='across'?'down':'across');
  if(!wordAt(r,c,dir)) return;
  active={r:r,c:c,dir:dir};
  render();
  if(doFocus) cells[r][c].inp.focus();
}
function toggleDir(r,c){
  var other=(active.dir==='across'?'down':'across');
  if(wordAt(r,c,other)){ active.dir=other; render(); }
}
function wordAt(r,c,dir){
  for(var i=0;i<words.length;i++){
    var w=words[i]; if(w.dir!==dir) continue;
    for(var k=0;k<w.cells.length;k++){ if(w.cells[k][0]===r&&w.cells[k][1]===c) return w; }
  }
  return null;
}
function activeWord(){ return active?wordAt(active.r,active.c,active.dir):null; }

// 다음/이전 칸으로 이동(현재 단어 내)
function step(dir){
  var w=activeWord(); if(!w) return;
  var idx=-1;
  for(var k=0;k<w.cells.length;k++){ if(w.cells[k][0]===active.r&&w.cells[k][1]===active.c){ idx=k; break; } }
  var ni=idx+dir;
  if(ni<0||ni>=w.cells.length){ return; }
  var nc=w.cells[ni]; active.r=nc[0]; active.c=nc[1]; render(); cells[nc[0]][nc[1]].inp.focus();
}
// 격자 이동(방향키): 다음 흰 칸으로
function move(r,c,dr,dc){
  var nr=r+dr,nc=c+dc;
  while(nr>=0&&nr<P.rows&&nc>=0&&nc<P.cols){
    if(grid[nr][nc]!==null){ active={r:nr,c:nc,dir:(dr!==0?'down':'across')}; if(!wordAt(nr,nc,active.dir))active.dir=(active.dir==='across'?'down':'across'); render(); cells[nr][nc].inp.focus(); return; }
    nr+=dr; nc+=dc;
  }
}

function setWrong(r,c,on){ if(cells[r]&&cells[r][c]) cells[r][c].el.classList.toggle('wrong',!!on); }

// 하이라이트/현재 힌트 갱신
function render(){
  for(var r=0;r<P.rows;r++)for(var c=0;c<P.cols;c++){
    if(!cells[r]||!cells[r][c])continue;
    cells[r][c].el.classList.remove('hl','active');
  }
  var w=activeWord();
  if(w){
    w.cells.forEach(function(cc){ cells[cc[0]][cc[1]].el.classList.add('hl'); });
    if(active) cells[active.r][active.c].el.classList.add('active');
    curEl.innerHTML='<b>'+(w.dir==='across'?'가로':'세로')+' '+w.num+'.</b> '+esc(w.clue);
  }
  // 힌트 목록 활성 표시
  [].forEach.call(cluesEl.querySelectorAll('.clue'),function(el){
    el.classList.toggle('on', w && el.dataset.dir===w.dir && +el.dataset.num===w.num);
  });
}

function esc(t){ var d=document.createElement('div'); d.textContent=t; return d.innerHTML; }

// 힌트 목록
function buildClues(){
  function list(title,dir){
    var col=document.createElement('div'); col.className='col';
    col.innerHTML='<h3>'+title+'</h3>';
    words.filter(function(w){return w.dir===dir;})
         .sort(function(a,b){return a.num-b.num;})
         .forEach(function(w){
      var row=document.createElement('div'); row.className='clue';
      row.dataset.dir=dir; row.dataset.num=w.num;
      row.innerHTML='<span class="cn">'+w.num+'</span><span>'+esc(w.clue)+'</span>';
      row.onclick=function(){ selectWord(w); };
      col.appendChild(row);
    });
    return col;
  }
  cluesEl.innerHTML='';
  cluesEl.appendChild(list('가로 열쇠','across'));
  cluesEl.appendChild(list('세로 열쇠','down'));
}
function selectWord(w){
  // 첫 빈 칸(없으면 첫 칸)으로 포커스
  var target=w.cells[0];
  for(var k=0;k<w.cells.length;k++){ var cc=w.cells[k]; if(cells[cc[0]][cc[1]].inp.value===''){ target=cc; break; } }
  active={r:target[0],c:target[1],dir:w.dir};
  render(); cells[target[0]][target[1]].inp.focus();
}

// ── 타이머 ──
function startTimer(){ if(running||cleared)return; running=true; t0=Date.now()-0; tick=setInterval(paint,500); paint(); }
function stopTimer(){ if(tick){clearInterval(tick);tick=null;} running=false; }
function elapsed(){ return t0?Math.floor((Date.now()-t0)/1000):0; }
function paint(){ var s=elapsed(); timerEl.textContent=Math.floor(s/60)+':'+('0'+(s%60)).slice(-2); }

// ── 정답 확인 ──
function check(){
  if(cleared)return;
  var empty=0,wrong=0;
  for(var r=0;r<P.rows;r++)for(var c=0;c<P.cols;c++){
    if(grid[r][c]===null)continue;
    var v=cells[r][c].inp.value;
    if(v===''){ empty++; setWrong(r,c,false); continue; }
    if(v!==grid[r][c]){ wrong++; setWrong(r,c,true); }
    else setWrong(r,c,false);
  }
  if(empty>0){ msgEl.style.color='var(--yellow)'; msgEl.textContent='아직 빈 칸이 '+empty+'개 남았어요.'; return; }
  if(wrong>0){ msgEl.style.color='#e88'; msgEl.textContent='틀린 칸이 '+wrong+'개 있어요. (빨간 칸 확인)'; return; }
  win();
}

function win(){
  cleared=true; stopTimer();
  var s=elapsed();
  // 완성 표시
  for(var r=0;r<P.rows;r++)for(var c=0;c<P.cols;c++){ if(grid[r][c]!==null){ cells[r][c].el.classList.remove('wrong','hl','active'); cells[r][c].el.classList.add('ok'); cells[r][c].inp.blur(); } }
  msgEl.style.color='var(--coral)';
  msgEl.textContent='🎉 클리어! '+Math.floor(s/60)+'분 '+(s%60)+'초';
  if(window.PFRank) PFRank.end('crossword-'+P.id, s, {label:'가로세로 '+P.name, unit:'초', lowerBetter:true});
}

// ── 지우기 ──
document.getElementById('btnClear').onclick=function(){
  if(cleared){ load(indexOf()); return; }
  for(var r=0;r<P.rows;r++)for(var c=0;c<P.cols;c++){ if(grid[r][c]!==null){ cells[r][c].inp.value=''; setWrong(r,c,false); } }
  msgEl.textContent='';
};
document.getElementById('btnCheck').onclick=check;
function indexOf(){ for(var i=0;i<PUZZLES.length;i++)if(PUZZLES[i]===P)return i; return 0; }

// 첫 퍼즐 로드
load(0);
})();
</script>
