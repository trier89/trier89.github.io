<script>
/* ===================== 픽셀 스프라이트 (신수 = 아기 올빼미 MVP) =====================
   각 스프라이트는 16x16, 문자 팔레트: '.'=투명 'X'=먹색 'o'=연한먹 '*'=포인트(부리/눈빛) */
var PAL={'X':'#2b3a1a','o':'#5a7038','*':'#c98a2e','.':null,'#':'#2b3a1a'};
function S(rows){return rows;}
var SPR={
egg:S([

// 아기 올빼미 (기본)

"..XXo~~~~oXX....",
"...XXXXXXXX.....",

"................"]),
// 아기 - 신남/행복(반짝 눈)
baby_happy:S([
"........*.......",
"...X..*.....X...",
"..XXX......XXX..",
"..XXXXXXXXXXXX..",
".XXoooooooooXX*.",
".XoXXXoooXXXoX..",
".XXXXXoXoXXXXX..",

".XXooo o oooXX..",

"...XXXXXXXX.....",

// 아기 - 삐침/시무룩
baby_sad:S([

// 성체 - 일반 올빼미(아테나 신수): 더 큼/투구깃
owl:S([

// 성체 - 레어(빛나는): 반짝 다수 + 왕관깃

// 성체 - 삐친(방치): 등돌림 느낌 눈

};
/* ===================== 렌더 ===================== */
var cv=document.getElementById('lcd'),cx=cv.getContext('2d');
var PXW=cv.width, PXH=cv.height; // 128x112
function drawSprite(ctx,spr,ox,oy,scale){
  for(var y=0;y<spr.length;y++){var row=spr[y];for(var x=0;x<row.length;x++){var c=row[x];
    if(c==='~'){ctx.fillStyle='#2b3a1a';ctx.fillRect(ox+x*scale,oy+y*scale+scale-1,scale,1);continue;}
    if(c==='z'||c==='Z'){ctx.fillStyle='#2b3a1a';ctx.font=(scale*3)+'px monospace';ctx.fillText(c,ox+x*scale,oy+y*scale+scale*2);continue;}
    var col=PAL[c];if(col){ctx.fillStyle=col;ctx.fillRect(ox+x*scale,oy+y*scale,scale,scale);}}}
}
function lcdClear(){cx.fillStyle='#9fbf6b';cx.fillRect(0,0,PXW,PXH);
  // 은은한 스캔도트
  cx.fillStyle='rgba(0,0,0,0.035)';for(var y=0;y<PXH;y+=2){cx.fillRect(0,y,PXW,1);}}
var bob=0,tick=0,fx=[];
function render(){
  lcdClear();
  var spr=currentSprite();
  var scale=6; var w=16*scale, h=16*scale;
  var ox=Math.round((PXW-w)/2), oy=Math.round((PXH-h)/2)+Math.round(Math.sin(bob)*3)-4;
  drawSprite(cx,spr,ox,oy,scale);
  // 바닥선
  cx.fillStyle='rgba(43,58,26,.55)';cx.fillRect(14,PXH-12,PXW-28,2);
  // 이펙트(밥·하트 등)
  for(var i=fx.length-1;i>=0;i--){var f=fx[i];cx.fillStyle='#2b3a1a';cx.font='12px monospace';cx.fillText(f.ch,f.x,f.y);f.y-=0.8;f.life--;if(f.life<=0)fx.splice(i,1);}
  // 상태 아이콘(배고픔/행복 낮으면 표시)
  cx.font='10px monospace';cx.fillStyle='#2b3a1a';
  if(pet.stage!=='egg'){
    if(pet.hunger<25){cx.fillText('🍽',6,14);}
    if(pet.happy<25){cx.fillText('💧',PXW-18,14);}
    if(sleeping){cx.fillText('Z',PXW-16,PXH-14);}
  }
}
function pushFx(ch){fx.push({ch:ch,x:PXW/2-6+((Math.random()*30)-15),y:PXH/2-10,life:40});}

/* ===================== 게임 상태 ===================== */
var KEY='darak_pet_v1';
var pet=null, sleeping=false;
function freshPet(){return {species:'owl',name:'신수 알',stage:'egg',hunger:60,happy:60,exp:0,
  born:Date.now(),last:Date.now(),clicks:0,streak:0,lastAttend:0,attendDays:[],dex:[],cares:0,neglect:0,evolved:null};}

function load(){
  try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.stage){pet=s;}}catch(e){}
  if(!pet)pet=freshPet();
  applyOffline();
  checkAttendance();
  save();
}
function save(){pet.last=Date.now();try{localStorage.setItem(KEY,JSON.stringify(pet));}catch(e){}}

function applyOffline(){
  var now=Date.now();var mins=Math.min((now-(pet.last||now))/60000, 48*60); // 최대 48시간
  if(mins<1)return;
  // 시간당 배고픔 -8, 행복 -5 (자는 동안도 서서히)
  var dh=mins/60*8, dp=mins/60*5;
  if(pet.stage!=='egg'){
    pet.hunger=clamp(pet.hunger-dh);pet.happy=clamp(pet.happy-dp);
    if(pet.hunger<15||pet.happy<15)pet.neglect+=Math.floor(mins/120);
    if(mins>30)setTimeout(function(){toast('"'+petTitle()+'가 자는 동안 배고파졌어요!"');},600);
  }
}
function checkAttendance(){
  var today=new Date();today.setHours(0,0,0,0);var t=today.getTime();
  if(pet.lastAttend===t)return;
  var yest=t-86400000;
  pet.streak=(pet.lastAttend===yest)?(pet.streak+1):1;
  pet.lastAttend=t;
  var slot=(pet.streak-1)%7;
  pet.attendDays=pet.attendDays||[];
  if(pet.attendDays.indexOf(slot)<0)pet.attendDays.push(slot);
  if(pet.streak%7===1&&pet.streak>1)pet.attendDays=[0];
  // 출석 보상: 밥 +12
  if(pet.stage!=='egg'){pet.hunger=clamp(pet.hunger+12);setTimeout(function(){toast('🗓 출석 보상! 밥 +12 (연속 '+pet.streak+'일)');},1100);}
}
function clamp(v){return Math.max(0,Math.min(100,Math.round(v)));}

var NAMES={owl:'아테나 올빼미',pegasus:'페가수스',hydra:'히드라',lion:'네메아 사자'};
function petTitle(){return pet.name||NAMES[pet.species]||'신수';}
function currentSprite(){
  if(pet.stage==='egg')return SPR.egg;
  if(sleeping)return SPR.baby_sleep;
  if(pet.stage==='baby'){
    if(pet.hunger<25)return SPR.baby_hungry;
    if(pet.happy<25)return SPR.baby_sad;
    if(pet.happy>75)return SPR.baby_happy;
    return SPR.baby;
  }
  // adult
  if(pet.evolved==='rare')return SPR.owl_rare;
  if(pet.evolved==='sulk')return SPR.owl_sulk;
  return SPR.owl;
}

/* ===================== 액션 ===================== */
function gain(exp){pet.exp+=exp;pet.cares++;checkEvolve();}
function feed(){if(sleeping)return wake();
  if(pet.stage==='egg')return hatchClick();
  if(pet.hunger>=98)return toast('배가 불러요 🍖');
  pet.hunger=clamp(pet.hunger+22);pet.happy=clamp(pet.happy+3);gain(4);pushFx('🍖');toast(petTitle()+'가 냠냠 먹었어요');afterAct();}
function play(){if(sleeping)return wake();
  if(pet.stage==='egg')return hatchClick();
  if(pet.hunger<12)return toast('너무 배고파서 못 놀아요 🍖');
  pet.happy=clamp(pet.happy+20);pet.hunger=clamp(pet.hunger-6);gain(6);pushFx('🎾');toast('신나게 놀았어요!');afterAct();}
function petAct(){if(sleeping)return wake();
  if(pet.stage==='egg')return hatchClick();
  pet.happy=clamp(pet.happy+10);gain(3);pushFx('💖');toast('기분이 좋아졌어요 💖');afterAct();}
function sleepAct(){if(pet.stage==='egg')return hatchClick();
  sleeping=!sleeping;
  if(sleeping){toast('쿨쿨… 재우는 중 (다시 누르면 깨우기)');}else{pet.happy=clamp(pet.happy+6);toast('잘 잤어요! ☀️');}
  afterAct();}
function wake(){sleeping=false;afterAct();}
function afterAct(){save();paint();}

function hatchClick(){
  pet.clicks++;pushFx('✨');
  if(pet.clicks>=3){
    pet.stage='baby';pet.name='';pet.hunger=70;pet.happy=70;pet.exp=0;
    save();paint();
    surprise(SPR.baby,'부화 성공! 🐣','아테나의 아기 올빼미가 태어났어요! 밥 주고 놀아주며 키워보세요.');
    addDex('baby');
  }else{toast('알이 흔들려요… ('+pet.clicks+'/3) 톡톡 두드려요!');save();paint();}
}

/* ===================== 진화 ===================== */
function checkEvolve(){
  if(pet.stage==='baby' && pet.exp>=60){
    pet.stage='adult';
    // 분기: 방치 많으면 삐침, 행복 평균 높으면 레어, 아니면 일반
    var kind = pet.neglect>=3 ? 'sulk' : (pet.happy>=72 && pet.neglect===0 ? 'rare':'normal');
    pet.evolved=kind;
    var spr = kind==='rare'?SPR.owl_rare:(kind==='sulk'?SPR.owl_sulk:SPR.owl);
    var title = kind==='rare'?'✨ 빛나는 아테나 올빼미!':(kind==='sulk'?'😔 삐친 올빼미…':'🦉 아테나 올빼미 성체!');
    var desc = kind==='rare'?'정성껏 돌봐서 레어 진화! 빛나는 신수가 됐어요. 자랑해도 좋아요!':(kind==='sulk'?'조금 외로웠나 봐요. 그래도 곁에 있어줘서 고마워해요.':'무럭무럭 자라 어엿한 성체가 됐어요!');
    save();paint();
    surprise(spr,title,desc);
    addDex('owl_'+kind);
  }
}
function addDex(id){pet.dex=pet.dex||[];if(pet.dex.indexOf(id)<0){pet.dex.push(id);save();}}

/* ===================== UI 페인트 ===================== */
function paint(){
  document.getElementById('vH').textContent=pet.hunger;
  document.getElementById('vP').textContent=pet.happy;
  document.getElementById('vG').textContent=Math.min(100,Math.round(pet.stage==='baby'?pet.exp/60*100:(pet.stage==='adult'?100:0)));
  document.getElementById('bH').style.width=pet.hunger+'%';
  document.getElementById('bP').style.width=pet.happy+'%';
  document.getElementById('bG').style.width=(pet.stage==='baby'?Math.min(100,pet.exp/60*100):(pet.stage==='adult'?100:0))+'%';
  document.getElementById('petName').textContent = pet.stage==='egg'?'신수 알':petTitle();
  var sb={egg:'🥚 알',baby:'🐣 아기',adult:'🦉 성체'}[pet.stage];
  document.getElementById('stageBadge').textContent=sb+(pet.evolved==='rare'?' ✨레어':(pet.evolved==='sulk'?' 삐침':''));
  var days=Math.floor((Date.now()-pet.born)/86400000);
  document.getElementById('ageTxt').textContent='함께한 지 '+days+'일';
  document.getElementById('streak').textContent=pet.streak||0;
  // 출석 도장
  var ar=document.getElementById('attRow');ar.innerHTML='';
  for(var i=0;i<7;i++){var s=document.createElement('span');var done=(pet.attendDays||[]).indexOf(i)>=0;s.className=done?'done':'';s.textContent=done?'✓':(i+1);ar.appendChild(s);}
  // 도감
  var dr=document.getElementById('dexRow');dr.innerHTML='';
  var slots=[['baby','🐣'],['owl_normal','🦉'],['owl_rare','✨'],['owl_sulk','😔']];
  slots.forEach(function(sl){var d=document.createElement('div');d.className='slot'+((pet.dex||[]).indexOf(sl[0])>=0?' got':'');d.textContent=(pet.dex||[]).indexOf(sl[0])>=0?sl[1]:'?';dr.appendChild(d);});
  // 밥 잘 준 상태면 재우기 버튼 라벨 유지
}

/* ===================== 서프라이즈 오버레이 ===================== */
var ovc=document.getElementById('ovc'),ovx=ovc.getContext('2d');
function surprise(spr,title,desc){
  ovx.fillStyle='#9fbf6b';ovx.fillRect(0,0,24,24);drawSprite(ovx,spr,0,0,1.5);
  // 확대 렌더
  var big=document.getElementById('ovc');big.width=24;big.height=24;
  ovx.imageSmoothingEnabled=false;
  document.getElementById('ovTitle').textContent=title;
  document.getElementById('ovDesc').textContent=desc;
  document.getElementById('ov').classList.add('show');
  gtag('event','pet_milestone',{title:title});
}
document.getElementById('ovGo').onclick=function(){document.getElementById('ov').classList.remove('show');};

/* ===================== 세이브 코드 ===================== */
document.getElementById('btnCode').onclick=function(){
  var code=btoa(unescape(encodeURIComponent(JSON.stringify(pet))));
  var inp=prompt('세이브 코드입니다. 복사해두면 다른 기기에서 불러올 수 있어요.\n\n다른 코드를 붙여넣으면 그 상태로 불러옵니다:',code);
  if(inp&&inp!==code){try{var p=JSON.parse(decodeURIComponent(escape(atob(inp.trim()))));if(p&&p.stage){pet=p;save();paint();toast('세이브 불러왔어요!');}}catch(e){toast('코드가 올바르지 않아요');}}
};
document.getElementById('btnReset').onclick=function(){
  if(confirm('지금 신수를 두고 새 알부터 다시 시작할까요? (되돌릴 수 없어요)')){var dex=pet.dex||[];pet=freshPet();pet.dex=dex;save();paint();toast('새 알을 받았어요 🥚');}
};

/* ===================== 토스트 ===================== */
var toastT;
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show');},2200);}

/* ===================== 루프 ===================== */
document.getElementById('btnFeed').onclick=feed;
document.getElementById('btnPlay').onclick=play;
document.getElementById('btnPet').onclick=petAct;
document.getElementById('btnSleep').onclick=sleepAct;
cv.onclick=function(){if(pet.stage==='egg')hatchClick();else petAct();};

load();paint();
setInterval(function(){bob+=0.15;tick++;
  // 실시간 완만 감소(1분마다 배고픔-1)
  if(tick%600===0 && pet.stage!=='egg' && !sleeping){pet.hunger=clamp(pet.hunger-1);if(tick%1800===0)pet.happy=clamp(pet.happy-1);save();paint();}
  render();
},100);
render();
</script>
