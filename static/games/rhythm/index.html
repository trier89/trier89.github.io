var hi=+localStorage.getItem('rhythm_hi')||0;hiE.textContent=hi;

// ── 키 구성 (5키 / 7키) ──
var KEYSETS={
  5:{keys:['d','f',' ','j','k'],labels:['D','F','SPACE','J','K'],
     code:{KeyD:0,KeyF:1,Space:2,KeyJ:3,KeyK:4},
     col:['#31c7ef','#f7d308','#ef7921','#ef2029','#42b642']},
  7:{keys:['s','d','f',' ','j','k','l'],labels:['S','D','F','SPACE','J','K','L'],

     col:['#31c7ef','#7b6cff','#f7d308','#ef7921','#ff5ea8','#ef2029','#42b642']}
};
// 런타임 파라미터(키 선택 시 설정)
var LANES=5,LW=W/5,KEYS=KEYSETS[5].keys,CODEMAP=KEYSETS[5].code,LANECOL=KEYSETS[5].col;

// ── 음이름 → 주파수 (A4=440 평균율) ──
function N(name){
  var m=/^([A-G])(#?)(-?\d)$/.exec(name);if(!m)return 440;
  var base={C:-9,D:-7,E:-5,F:-4,G:-2,A:0,B:2};
  var s=base[m[1]]+(m[2]?1:0)+(+m[3]-4)*12;
  return 440*Math.pow(2,s/12);
}
function seqParse(str){
  return str.trim().split(/\s+/).map(function(tok){var p=tok.split('/');return {nm:p[0],dur:p[1]?parseFloat(p[1]):1};});
}
// ── 화성(원곡 반주 화음) 시스템 ──
// 코드심볼(예: 'Am','E7','F#m','G7')→구성 음(피치클래스). 각 곡의 실제 화성진행을 코드로 인코딩.
var CHORDQ={'':[0,4,7],'m':[0,3,7],'7':[0,4,7,10],'m7':[0,3,7,10],'maj7':[0,4,7,11],'dim':[0,3,6],'sus4':[0,5,7],'6':[0,4,7,9]};
var PCROOT={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function chordPcs(sym){
  var m=/^([A-G])(#|b)?(.*)$/.exec(sym);if(!m)return[0,4,7];
  var root=PCROOT[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0);
  var q=CHORDQ[m[3]||'']||[0,4,7];
  return q.map(function(x){return((root+x)%12+12)%12;});
}
function buildChords(str){                                  // "Am:8 E:4 ..." → 코드 세그먼트 타임라인
  var segs=[],b=0;
  str.trim().split(/\s+/).forEach(function(tok){var p=tok.split(':');var dur=p[1]?parseFloat(p[1]):2;segs.push({start:b,end:b+dur,pcs:chordPcs(p[0])});b+=dur;});
  return segs;
}
function chordAt(segs,beat){                                // 그 beat에 울리는 코드(넘어가면 마지막 코드로 clamp)
  for(var i=0;i<segs.length;i++){if(beat>=segs[i].start&&beat<segs[i].end)return segs[i].pcs;}
  return segs[segs.length-1].pcs;
}
var CONS_IV={3:1,4:1,5:1,7:1,8:1,9:1,12:1};                 // 협화 음정(m3·M3·P4·P5·m6·M6·옥타브)
// 멜로디음 아래에서, 그 코드의 '실제 구성음' 중 협화 음정으로 가장 가까운 음을 화음으로. 없으면 완전5도 아래.
function harmonyFreq(melFreq,pcs){
  var melMidi=Math.round(69+12*Math.log(melFreq/440)/Math.LN2);
  for(var d=3;d<=19;d++){
    var mm=melMidi-d, pc=((mm%12)+12)%12;
    if(pcs.indexOf(pc)>=0){var iv=d%12;if(iv===0)iv=12;if(CONS_IV[iv])return 440*Math.pow(2,(mm-69)/12);}
  }
  return melFreq*Math.pow(2,-7/12);
}

// ── 음높이 → 레인 균등 매핑 (낮은음→왼쪽, 높은음→오른쪽) ──
function assignLanes(list,lanes){
  var uniq=[];list.forEach(function(n){if(uniq.indexOf(n.pitch)<0)uniq.push(n.pitch);});
  uniq.sort(function(a,b){return a-b;});
  list.forEach(function(n){
    var idx=uniq.indexOf(n.pitch);
    n.lane=(uniq.length>1)?Math.round(idx/(uniq.length-1)*(lanes-1)):(lanes>>1);
  });
}
// ── 곡 + 난이도 → 노트 배열 ──
function buildNotes(song,diff,lanes){
  // 곡 전체(다중섹션)를 원곡 리듬대로 파싱. 반복 없이 seq 그대로가 곡의 진행.
  var seq=seqParse(song.seq),base=[],b=0;
  for(var i=0;i<seq.length;i++){
    if(seq[i].nm!=='R')base.push({beat:b,pitch:N(seq[i].nm),dur:seq[i].dur});
    b+=seq[i].dur;
  }
  var list;
  if(diff==='easy')list=base.filter(function(n,i){return i%2===0;}); // 절반 샘플링(듬성)
  else list=base.slice();                                            // 보통/어려움 = 전체
  assignLanes(list,lanes);
  if(diff==='hard'&&song.chordSegs){                                 // 화음(동시) 노트 = 그 곡의 실제 반주 화음 코드톤
    // 알고리즘 3도가 아니라, 각 beat에 울리는 원곡 코드의 실제 구성음을 멜로디 아래 협화 위치로 골라 화음.
    var uniq=[];list.forEach(function(n){if(uniq.indexOf(n.pitch)<0)uniq.push(n.pitch);});uniq.sort(function(a,b){return a-b;});
    var U=uniq.length, extra=[];
    for(var j=0;j<list.length;j++){
      if(j%3!==2)continue;
      var p=list[j];
      var pcs=chordAt(song.chordSegs,p.beat);                        // 그 순간의 원곡 화음
      var hp=harmonyFreq(p.pitch,pcs);                               // 그 코드의 실제 코드톤(멜로디 아래·협화)
      var r=0;while(r<U&&uniq[r]<hp-0.01)r++;                        // 화음음의 레인 = 멜로디 음역 내 랭크 매핑
      var clane=(U>1)?Math.round(Math.min(r,U-1)/(U-1)*(lanes-1)):(lanes>>1);
      if(clane===p.lane)clane=(clane+1)%lanes;                       // 같은 레인 충돌 회피
      if(clane===p.lane)clane=(clane+2)%lanes;
      extra.push({beat:p.beat,pitch:hp,dur:Math.min(p.dur,1),lane:clane});
    }
    list=list.concat(extra);
  }
  // 런타임 필드 초기화
  list.forEach(function(n){n.hit=false;n.done=false;n.holding=false;n.lastTick=0;n.tailBeat=n.beat+n.dur;n.hold=(n.dur>=1.5);});
  list.sort(function(a,b){return a.beat-b.beat||a.lane-b.lane;});
  // 레인별 대표 음(빈 탭 소리용)
  lanePitch=[];var cnt=[];
  for(var k=0;k<lanes;k++){lanePitch[k]=0;cnt[k]=0;}
  list.forEach(function(n){lanePitch[n.lane]+=n.pitch;cnt[n.lane]++;});
  for(var k2=0;k2<lanes;k2++){lanePitch[k2]=cnt[k2]?lanePitch[k2]/cnt[k2]:440*Math.pow(2,(k2-lanes/2)/6);}
  return list;
}

// ── 오디오 합성 (피아노풍: 기본음+배음 겹침 + 빠른 어택·지수 감쇠 + 밝기 감쇠 필터) ──
var pianoWave;
function initPiano(){
  // 배음 계수(피아노 근사): 기본음1 + 2·3·4…배음 점감. PeriodicWave로 한 오실레이터에 배음 겹침.
  var real=new Float32Array([0,1,0.55,0.33,0.18,0.11,0.07,0.04,0.02]);
  var imag=new Float32Array(real.length);
  pianoWave=AC.createPeriodicWave(real,imag);
}
// 피아노 타건음: 어택 ~0.004s → 지수 감쇠(서스테인 평탄부 없음), 로우패스가 시간에 따라 닫혀 타건감.
function piano(freq,t,gainv,dec){
  var o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();
  o.setPeriodicWave(pianoWave);o.frequency.value=freq;
  var pk=gainv||0.2, d=dec||1.4;
  f.type='lowpass';f.frequency.setValueAtTime(Math.min(9000,freq*7),t);f.frequency.exponentialRampToValueAtTime(Math.max(700,freq*2),t+d);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(pk,t+0.004);      // 빠른 타건 어택
  g.gain.exponentialRampToValueAtTime(0.0001,t+d);      // 지수 감쇠(피아노 여운)
  o.connect(f);f.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.05);
}
// 둔탁한 킥: 피치 급강하 사인 + 아주 짧은 감쇠.
function kick(t){
  var o=AC.createOscillator(),g=AC.createGain();
  o.type='sine';o.frequency.setValueAtTime(115,t);o.frequency.exponentialRampToValueAtTime(45,t+0.09);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.12,t+0.006);g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.18);
}
// 롱노트 홀드음: 피아노 타건 후 약한 서스테인 유지(페달 밟은 느낌 — 게임 홀드 피드백용 절충).
function holdTone(freq){
  var o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter(),t=AC.currentTime;
  o.setPeriodicWave(pianoWave);o.frequency.value=freq;
  f.type='lowpass';f.frequency.setValueAtTime(freq*7,t);f.frequency.exponentialRampToValueAtTime(freq*2.2,t+1.2);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.2,t+0.004);     // 타건
  g.gain.exponentialRampToValueAtTime(0.08,t+1.1);      // 감쇠 후 약한 서스테인
  o.connect(f);f.connect(g);g.connect(AC.destination);o.start();
  return {o:o,g:g};
}
function stopTone(s){if(!s)return;try{var t=AC.currentTime;s.g.gain.cancelScheduledValues(t);s.g.gain.setValueAtTime(s.g.gain.value||0.001,t);s.g.gain.exponentialRampToValueAtTime(0.0008,t+0.08);s.o.stop(t+0.12);}catch(e){}}

function schedule(){
  // 리드인: 첫 노트가 맨 위에서 판정선까지 내려오는 시간(HITY/SPEED) + 준비 여유(600ms).
  // 이래야 3·2·1 후 노트가 위에서 차분히 내려와 칠 수 있음(바로 판정선에 안 뜸).
  var lead=HITY/SPEED+600;
  var base=AC.currentTime+lead/1000;   // 배경비트도 리드인 후 시작(노트와 동기)
  // 멜로디는 자동재생 안 함 — 플레이어가 맞출 때 그 음이 울려 곡이 완성됨. 배경(베이스/킥)만 가이드.
  for(var b=0;b<=songEnd;b+=1){piano(130.81,base+b*BEAT/1000,0.08,0.7);}              // bass 피아노 저음풍
  for(var b=0;b<=songEnd;b+=1){kick(base+b*BEAT/1000);}                               // kick 둔탁
  t0=performance.now()+lead;                                                           // 화면 노트 기준시각(리드인 반영, 오디오 base와 동기)
}

function setBtn(lane,on){var el=document.getElementById('r'+lane);if(el)el.classList.toggle('hold',on);}
function laneAtPoint(x,y){var el=document.elementFromPoint(x,y);while(el&&el!==btnrow){if(el.classList&&el.classList.contains('rbtn'))return +el.id.slice(1);el=el.parentNode;}return -1;}
var touchLane={};  // touch.identifier → lane. 손가락마다 독립 추적 → 롱노트 홀드 중 다른 레인 탭 동시 가능
btnrow.addEventListener('touchstart',function(e){e.preventDefault();for(var i=0;i<e.changedTouches.length;i++){var tc=e.changedTouches[i],lane=laneAtPoint(tc.clientX,tc.clientY);if(lane>=0){touchLane[tc.identifier]=lane;setBtn(lane,true);hitLane(lane);}}},{passive:false});
btnrow.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});
function endTouch(e){e.preventDefault();for(var i=0;i<e.changedTouches.length;i++){var tc=e.changedTouches[i];if(tc.identifier in touchLane){var lane=touchLane[tc.identifier];delete touchLane[tc.identifier];setBtn(lane,false);releaseLane(lane);}}}
btnrow.addEventListener('touchend',endTouch,{passive:false});
btnrow.addEventListener('touchcancel',endTouch,{passive:false});
var mouseLane=-1;  // 데스크톱 단일 포인터
btnrow.addEventListener('mousedown',function(e){var lane=laneAtPoint(e.clientX,e.clientY);if(lane>=0){e.preventDefault();mouseLane=lane;setBtn(lane,true);hitLane(lane);}});

  h+='</div></div>';
  h+='<button class="gostart" id="gostart">▶ 시작 (소리 켜기)</button>';
  h+='<div class="selhint">노트를 맞추면 그 음이 울려 멜로디가 완성돼요.<br>긴 음표는 <b style="color:#e0c07e">롱노트</b> — 눌러서 끝까지 홀드! (저작권 프리 🎶)</div>';
  ovin.innerHTML=h;ov.style.display='flex';

  ovin.querySelectorAll('.song').forEach(function(el){el.onclick=function(){sel.song=+el.getAttribute('data-song');showSelect();};});
  ovin.querySelectorAll('.chip').forEach(function(el){el.onclick=function(){
    var opt=el.parentNode.getAttribute('data-opt'),v=el.getAttribute('data-v');
    if(opt==='keys')sel.keys=+v;else if(opt==='speed')sel.speed=+v;else if(opt==='diff')sel.diff=v;
    showSelect();
  };});
  document.getElementById('gostart').onclick=start;
}

function start(){
  if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended')AC.resume();
  if(!pianoWave)initPiano();
  // 키 파라미터 적용
  var ks=KEYSETS[sel.keys];LANES=sel.keys;LW=W/LANES;KEYS=ks.keys;CODEMAP=ks.code;LANECOL=ks.col;
  buildButtons();
  var song=SONGS[sel.song];
  BEAT=60000/song.bpm;SPEED=BASESPEED*sel.speed;WINDOW=DIFFWIN[sel.diff];
  notes=buildNotes(song,sel.diff,LANES);
  holdingNote=[];for(var i=0;i<LANES;i++)holdingNote[i]=null;
  songEnd=0;notes.forEach(function(n){if(n.tailBeat>songEnd)songEnd=n.tailBeat;});
  score=0;combo=0;maxcombo=0;hitCnt=0;missCnt=0;total=notes.length;
  ov.style.display='none';sync();
  state='count';countdown(function(){schedule();state='play';raf=requestAnimationFrame(loop);});
  gtag('event','rhythm_start',{song:song.name,keys:sel.keys,diff:sel.diff,speed:sel.speed});
}
// 3·2·1·START! 카운트다운 (state='count'라 hitLane/releaseLane 무시됨)
function countdown(cb){
  var seq=['3','2','1','START!'],i=0;
  function drawField(){
    ctx.fillStyle='#12120f';ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='#e0c07e';ctx.lineWidth=4;ctx.shadowColor='#e0c07e';ctx.shadowBlur=14;
    ctx.beginPath();ctx.moveTo(0,HITY);ctx.lineTo(W,HITY);ctx.stroke();ctx.shadowBlur=0;
    for(var j=0;j<LANES;j++){ctx.strokeStyle=LANECOL[j];ctx.lineWidth=3;ctx.beginPath();ctx.arc(j*LW+LW/2,HITY,LW*0.3,0,7);ctx.stroke();}
  }
  function step(){
    drawField();
    var txt=seq[i],go=(txt==='START!');
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle=go?'#7fb069':'#e0c07e';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=20;
    ctx.font='bold '+(go?54:120)+'px sans-serif';ctx.fillText(txt,W/2,H*0.42);
    ctx.shadowBlur=0;ctx.textBaseline='alphabetic';
    if(AC&&pianoWave){piano(go?659.25:440,AC.currentTime+0.01,go?0.22:0.16,go?0.5:0.35);}
    i++;setTimeout(i<seq.length?step:cb,go?650:750);
  }
  step();
}
function sync(){scE.textContent=score;cbE.textContent=combo;acE.textContent=(Math.round(hitCnt/Math.max(1,hitCnt+missCnt)*100))+'%';}

function rr(x,y,w,h,r){if(ctx.roundRect){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}else{ctx.beginPath();ctx.rect(x,y,w,h);}}

function loop(t){
  if(state!=='play')return;
  ctx.fillStyle='#0d0d10';ctx.fillRect(0,0,W,H);
  for(var i=0;i<LANES;i++){ctx.fillStyle=i%2?'#141418':'#101014';ctx.fillRect(i*LW,0,LW,H);}
  // 판정선
  ctx.fillStyle='rgba(224,192,126,.10)';ctx.fillRect(0,HITY-22,W,44);
  ctx.strokeStyle='#e0c07e';ctx.lineWidth=4;ctx.shadowColor='#e0c07e';ctx.shadowBlur=14;ctx.beginPath();ctx.moveTo(0,HITY);ctx.lineTo(W,HITY);ctx.stroke();ctx.shadowBlur=0;
  for(var i=0;i<LANES;i++){
    ctx.strokeStyle=LANECOL[i];ctx.lineWidth=3;ctx.beginPath();ctx.arc(i*LW+LW/2,HITY,LW*0.3,0,7);ctx.stroke();
    if(holdingNote[i]){ctx.fillStyle=LANECOL[i];ctx.globalAlpha=0.28;ctx.fillRect(i*LW,0,LW,H);ctx.globalAlpha=1;} // 홀드 중 레인 밝게
  }
  ctx.fillStyle='#e0c07e';ctx.font='11px monospace';ctx.textAlign='center';ctx.fillText('▼ 여기서 맞춰요 ▼',W/2,HITY-28);

  var now=t-t0;
  notes.forEach(function(n){
    if(n.done)return;
    var headT=n.beat*BEAT, y=HITY-(headT-now)*SPEED;
    if(n.hold){
      // 홀드 중 자동 성공: 꼬리를 지나서도 계속 누르고 있으면 성공 처리
      if(n.holding){
        if(now - n.lastTick>120){score+=5;n.lastTick=now;sync();}      // 홀드 점수 틱(콤보 유지)
        if(now>=n.tailBeat*BEAT+WINDOW){finishHold(n,true);return;}
      } else if(!n.hit && now-headT>WINDOW){ n.done=true;missCnt++;combo=0;sync();return; } // 머리 놓침
      // 렌더: 머리~꼬리 바
      var tailY=HITY-(n.tailBeat*BEAT-now)*SPEED;
      var by=n.holding?HITY:y, top=Math.min(tailY,by), bot=Math.max(tailY,by);
      if(bot>-20&&top<H+20){
        ctx.fillStyle=LANECOL[n.lane];ctx.globalAlpha=n.holding?0.55:0.32;
        rr(n.lane*LW+10,top,LW-20,Math.max(6,bot-top),7);ctx.fill();ctx.globalAlpha=1;
        // 머리 캡
        ctx.fillStyle=LANECOL[n.lane];rr(n.lane*LW+8,by-9,LW-16,18,5);ctx.fill();
      }
    } else {
      if(!n.hit && now-headT>WINDOW){n.done=true;missCnt++;combo=0;sync();return;}
      if(y>-20&&y<H+20){ctx.fillStyle=LANECOL[n.lane];rr(n.lane*LW+8,y-9,LW-16,18,5);ctx.fill();}
    }
  });
  drawFx(t);drawPops(t);
  if(now>songEnd*BEAT+900)return finish();
  raf=requestAnimationFrame(loop);
}
var fx=[];
function flash(lane,col){fx.push({lane:lane,col:col,t:performance.now()});}
function drawFx(t){ctx.textAlign='center';for(var i=fx.length-1;i>=0;i--){var f=fx[i],a=1-(t-f.t)/300;if(a<=0){fx.splice(i,1);continue;}ctx.globalAlpha=a*0.6;ctx.fillStyle=f.col;ctx.fillRect(f.lane*LW,HITY-40,LW,80);ctx.globalAlpha=1;}}
var pops=[];
function popup(txt,col){pops.push({txt:txt,col:col,t:performance.now()});}
function drawPops(t){ctx.textAlign='center';for(var i=pops.length-1;i>=0;i--){var p=pops[i],e=(t-p.t)/500;if(e>=1){pops.splice(i,1);continue;}ctx.globalAlpha=1-e;ctx.fillStyle=p.col;ctx.font='bold '+(30+e*16)+'px sans-serif';ctx.fillText(p.txt,W/2,H*0.42);ctx.globalAlpha=1;}}

// 홀드 종료 처리(성공/실패)
function finishHold(n,ok){
  n.holding=false;n.done=true;stopTone(n.snd);n.snd=null;holdingNote[n.lane]=null;
  if(ok){hitCnt++;combo++;maxcombo=Math.max(maxcombo,combo);score+=120*(1+((combo/10)|0));flash(n.lane,'#42b642');popup('CLEAR','#42b642');}
  else{missCnt++;combo=0;flash(n.lane,'#ef2029');popup('MISS','#ef2029');}
  sync();
}

// 누름(탭 판정 / 롱노트 머리 시작)
function hitLane(lane){
  if(state!=='play')return;
  var now=performance.now()-t0, best=null,bd=WINDOW+1;
  notes.forEach(function(n){
    if(n.done||n.lane!==lane)return;
    if(n.hold&&n.hit)return; // 이미 홀드 중인 머리 제외
    var d=Math.abs(n.beat*BEAT-now);if(d<bd){bd=d;best=n;}
  });
  if(best&&bd<=WINDOW){
    if(best.hold){
      best.hit=true;best.holding=true;best.lastTick=now;holdingNote[lane]=best;
      best.snd=holdTone(best.pitch);flash(lane,LANECOL[lane]);popup('HOLD','#e0c07e');
    } else {
      best.done=true;hitCnt++;combo++;maxcombo=Math.max(maxcombo,combo);
      var pts=bd<WINDOW*0.4?100:bd<WINDOW*0.7?60:30;
      score+=pts*(1+((combo/10)|0));
      piano(best.pitch,AC.currentTime,0.24,1.5);   // 맞춘 음이 피아노로 울려 멜로디 완성
      flash(lane,'#42b642');popup(bd<WINDOW*0.4?'PERFECT':'GOOD','#42b642');
    }
    sync();
  } else {
    piano(lanePitch[lane]||440,AC.currentTime,0.10,0.4); // 빗나가면 짧고 약한 피아노음
    combo=0;flash(lane,'#ef2029');popup('MISS','#ef2029');sync();
  }
}
// 뗌(롱노트 꼬리 판정)
function releaseLane(lane){
  if(state!=='play')return;
  var n=holdingNote[lane];if(!n)return;
  var now=performance.now()-t0, tail=n.tailBeat*BEAT;
  finishHold(n, now>=tail-WINDOW);   // 꼬리 근처면 성공, 너무 일찍 놓으면 실패
}

function finish(){
  state='over';cancelAnimationFrame(raf);
  // 남은 홀드 정리
  if(holdingNote)for(var i=0;i<holdingNote.length;i++){if(holdingNote[i]){stopTone(holdingNote[i].snd);holdingNote[i]=null;}}
  var acc=Math.round(hitCnt/Math.max(1,total)*100), song=SONGS[sel.song];
  if(score>hi){hi=score;localStorage.setItem('rhythm_hi',hi);hiE.textContent=hi;}
  var h='<h2>CLEAR! 🎵</h2>';
  h+='<p><b style="color:#e0c07e">'+song.name+'</b> · '+DIFFS.filter(function(d){return d.id===sel.diff;})[0].lab+' · '+sel.keys+'키<br>'
    +'점수 <b style="color:#e0c07e">'+score+'</b> · 정확도 '+acc+'% · 최고콤보 '+maxcombo+'<br>최고기록 '+hi+'</p>';
  h+='<button id="again" class="gostart">🔁 다시 선택</button>';
  h+='<button id="g-share" style="width:100%;margin-top:8px;background:transparent;border:1px solid #3e3e3a;color:#e8e6e3;padding:10px;border-radius:8px;cursor:pointer;font:inherit;">📤 자랑하기</button>';
  ovin.innerHTML=h;ov.style.display='flex';
  document.getElementById('again').onclick=showSelect;
  document.getElementById('g-share').onclick=function(){
    var txt='리듬게임 「'+song.name+'」 '+score+'점 (정확도 '+acc+'%)! 🎵 '+location.origin+location.pathname;
    if(navigator.share){navigator.share({text:txt});}else{navigator.clipboard.writeText(txt).then(function(){alert('복사됐어요!');});}
  };
  gtag('event','rhythm_clear',{song:song.name,score:score,acc:acc});
  if(window.PFRank){var _dl=DIFFS.filter(function(d){return d.id===sel.diff;})[0].lab;PFRank.end('rhythm-'+sel.song+'-'+sel.diff,score,{label:'리듬 · '+song.name+' ('+_dl+')',unit:'점'});}
}

// ── 물리 키 입력 (iPad CODEMAP 매핑 + 댓글 입력창 포커스 가드) ──
function laneFromEvent(e){
  if(e.code in CODEMAP)return CODEMAP[e.code];
  return KEYS.indexOf(e.key===' '?' ':(e.key||'').toLowerCase());
}
function inputFocused(t){var tag=(t&&t.tagName||'').toLowerCase();return tag==='input'||tag==='textarea'||tag==='select'||(t&&t.isContentEditable);}
document.addEventListener('keydown',function(e){
  if(inputFocused(e.target))return;       // 댓글 등 입력창 포커스 시 게임키 무시
  var i=laneFromEvent(e);if(i<0||i>=LANES)return;
  e.preventDefault();                     // ★게임키는 repeat 포함 항상 스크롤 방지 — SPACE 홀드(롱노트) 시 반복 keydown이 페이지 스크롤시키던 버그 수정
  if(e.repeat)return;                     // 반복 이벤트는 판정 스킵(홀드는 keyup까지 유지)
  if(state==='play')hitLane(i);           // 시작은 선택화면의 버튼으로만
});
document.addEventListener('keyup',function(e){
  if(inputFocused(e.target))return;
  var i=laneFromEvent(e);if(i<0||i>=LANES)return;
  if(state==='play'){e.preventDefault();releaseLane(i);}
});

// 초기화
buildButtons();
showSelect();
})();

</script>
