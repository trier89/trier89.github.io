<h1>💣 지뢰찾기</h1>
<div class="sub">클릭=열기 · 우클릭 또는 길게 누르기=🚩 깃발</div>
<div class="hud">
  <select id="level"><option value="9,9,10">초급 9×9</option><option value="12,12,24">중급 12×12</option><option value="14,14,40">고급 14×14</option></select>
  <span>🚩 <b id="flags">10</b></span>
  <span>⏱ <b id="time">0</b>s</span>
  <button id="new" class="primary">새 게임</button>
</div>
<div id="board"></div>
<div id="msg"></div>
<div class="foot"><div>🎮 <a href="/games/">게임방</a> · 🏠 <a href="/">에디슨의 놀이터</a></div></div>
<script>
(function(){
var $=function(id){return document.getElementById(id);};
var R,C,M,grid,opened,flagged,started,timer,sec,done;
function idx(r,c){return r*C+c;}
function neighbors(r,c){
  var out=[];
  for(var dr=-1;dr<=1;dr++)for(var dc=-1;dc<=1;dc++){
    if(!dr&&!dc)continue;
    var nr=r+dr,nc=c+dc;
    if(nr>=0&&nr<R&&nc>=0&&nc<C)out.push([nr,nc]);
  }
  return out;
}
function newGame(){
  var v=$('level').value.split(',');R=+v[0];C=+v[1];M=+v[2];
  grid=[];opened=0;flagged=0;started=false;done=false;sec=0;
  clearInterval(timer);$('time').textContent='0';$('flags').textContent=M;$('msg').textContent='';
  for(var i=0;i<R*C;i++)grid.push({mine:false,open:false,flag:false,n:0});
  var b=$('board');b.innerHTML='';b.style.gridTemplateColumns='repeat('+C+',1fr)';
  for(var r=0;r<R;r++)for(var c=0;c<C;c++){
    (function(r,c){
      var d=document.createElement('div');d.className='cell';d.id='c'+idx(r,c);
      d.addEventListener('click',function(){reveal(r,c);});
      d.addEventListener('contextmenu',function(e){e.preventDefault();flag(r,c);});
      var lt;
      d.addEventListener('touchstart',function(e){lt=setTimeout(function(){flag(r,c);lt=null;},420);},{passive:true});
      d.addEventListener('touchend',function(e){if(lt){clearTimeout(lt);}});
      d.addEventListener('touchmove',function(){if(lt){clearTimeout(lt);lt=null;}});
      b.appendChild(d);
    })(r,c);
  }
}
function placeMines(sr,sc){
  var safe=new Set([idx(sr,sc)]);
  neighbors(sr,sc).forEach(function(n){safe.add(idx(n[0],n[1]));});
  var placed=0;
  while(placed<M){
    var i=Math.floor(Math.random()*R*C);
    if(grid[i].mine||safe.has(i))continue;
    grid[i].mine=true;placed++;
  }
  for(var r=0;r<R;r++)for(var c=0;c<C;c++){
    if(grid[idx(r,c)].mine)continue;
    grid[idx(r,c)].n=neighbors(r,c).filter(function(n){return grid[idx(n[0],n[1])].mine;}).length;
  }
  timer=setInterval(function(){sec++;$('time').textContent=sec;},1000);
}
function reveal(r,c){
  if(done)return;
  var g=grid[idx(r,c)];
  if(g.open||g.flag)return;
  if(!started){started=true;placeMines(r,c);}
  g.open=true;opened++;
  var el=$('c'+idx(r,c));el.classList.add('open');
  if(g.mine){el.classList.add('boom');el.textContent='💥';lose();return;}
  if(g.n){el.textContent=g.n;el.classList.add('n'+g.n);}
  else{neighbors(r,c).forEach(function(n){reveal(n[0],n[1]);});}
  if(opened===R*C-M)win();
}
function flag(r,c){
  if(done)return;
  var g=grid[idx(r,c)];
  if(g.open)return;
  g.flag=!g.flag;flagged+=g.flag?1:-1;
  $('c'+idx(r,c)).textContent=g.flag?'🚩':'';
  $('flags').textContent=M-flagged;
}
function lose(){
  done=true;clearInterval(timer);
  grid.forEach(function(g,i){if(g.mine&&!g.open){var e=$('c'+i);e.classList.add('open');e.textContent='💣';}});
  $('msg').textContent='💥 펑! 다시 도전해보세요';
  $('msg').style.color='var(--red)';
}
function win(){
  done=true;clearInterval(timer);
  $('msg').textContent='🎉 클리어! '+sec+'초';
  $('msg').style.color='var(--green)';
  var key='mine_best_'+R+'x'+C;
  var best=+localStorage.getItem(key)||0;
  if(!best||sec<best){localStorage.setItem(key,sec);$('msg').textContent+=' — 신기록!';}
  var _sb=document.getElementById('m-share');
  if(!_sb){_sb=document.createElement('button');_sb.id='m-share';_sb.style.cssText='display:block;margin:10px auto 0;background:transparent;border:1px solid #3e3e3a;border-radius:8px;color:#e8e6e3;font:inherit;padding:8px 16px;cursor:pointer;';$('msg').after(_sb);}
  _sb.textContent='📤 기록 자랑하기';
  _sb.onclick=function(){var t='지뢰찾기 '+R+'×'+C+' '+sec+'초 클리어! 💣 나 이겨봐 '+location.origin+location.pathname;if(navigator.share){navigator.share({text:t});}else{navigator.clipboard.writeText(t).then(function(){alert('복사됐어요!');});}};
}
$('new').onclick=newGame;
$('level').onchange=newGame;
newGame();
})();
</script>
