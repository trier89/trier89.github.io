<style>
:root{--bg:#262624;--line:#3e3e3a;--txt:#e8e6e3;--dim:#9c9a94;--coral:#d97757;--green:#7fb069;--yellow:#e0c07e;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--txt);font-family:'SF Mono','D2Coding',Menlo,monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px 8px;touch-action:none;}

canvas{background:#0d0d10;border:2px solid var(--line);border-radius:10px;display:block;max-width:100%;}

#overlay h2{color:var(--coral);font-size:22px;letter-spacing:2px;}

<body>

<div style="max-width:760px;margin:0 auto 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:1px solid #3e3e3a;padding:10px 12px 12px;">
  <a href="/" style="color:#d97757;font-weight:800;font-size:15px;text-decoration:none;">✻ 계획대로 느긋하게</a>

    <a href="/games/" style="color:#d97757;text-decoration:none;border:1px solid #d97757;border-radius:14px;padding:4px 10px;font-size:12px;background:#1f1f1d;">🎮 게임방</a>
    <a href="/tests/" style="color:#e8e6e3;text-decoration:none;border:1px solid #3e3e3a;border-radius:14px;padding:4px 10px;font-size:12px;background:#1f1f1d;">🧠 심리테스트</a>
    <a href="/page/requests/" style="color:#e8e6e3;text-decoration:none;border:1px solid #3e3e3a;border-radius:14px;padding:4px 10px;font-size:12px;background:#1f1f1d;">💌 요청방</a>
  </nav>

<h1>🧱 벽돌깨기</h1>
<div class="sub">← → 키 또는 드래그로 패들 이동</div>
<div id="wrap">
  <canvas id="cv" width="480" height="600"></canvas>
  <div id="overlay">
    <h2>BRICK BREAKER</h2>
    <p>공을 튕겨 벽돌을 모두 깨세요.<br>레벨이 오를수록 공이 빨라지고 줄이 늘어납니다.</p>
    <button id="start">게임 시작</button>
  </div>
</div>
<div class="hud"><span>SCORE <b id="sc">0</b></span><span>LEVEL <b id="lvl">1</b></span><span>LIVES <b id="lv">3</b></span><span>BEST <b id="hi">0</b></span></div>
<div class="foot"><div>🎮 <a href="/games/">게임방</a> · 🏠 <a href="/">에디슨의 놀이터</a></div></div>
<script>
(function(){
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var W=480,H=600;
var scE=document.getElementById('sc'),lvlE=document.getElementById('lvl'),lvE=document.getElementById('lv'),hiE=document.getElementById('hi');
var overlay=document.getElementById('overlay'),startBtn=document.getElementById('start');
var hi=+localStorage.getItem('brick_hi')||0;hiE.textContent=hi;
var COLORS=['#d97757','#e0c07e','#7fb069','#7ea6e0','#cba6f7','#e07e7e'];
var state='idle',score,level,lives,paddle,ball,bricks,stuck;
function newLevel(){
  bricks=[];
  var rows=Math.min(4+level,9),cols=10,bw=W/cols;
  for(var r=0;r<rows;r++)for(var c=0;c<cols;c++){
    // 레벨 2+부터 두번 쳐야 하는 벽돌 섞임
    var hp=(level>=2&&r<2&&Math.random()<0.35)?2:1;
    bricks.push({x:c*bw+2,y:52+r*24,w:bw-4,h:20,hp:hp,c:COLORS[r%COLORS.length]});
  }
  stuck=true;
  ball={x:paddle.x,y:H-64,vx:0,vy:0,sp:4.6+level*0.55};
}
function reset(){
  score=0;level=1;lives=3;
  paddle={x:W/2,w:Math.max(92-0,92)};
  newLevel();sync();
}
function sync(){scE.textContent=score;lvlE.textContent=level;lvE.textContent=lives;hiE.textContent=hi;}
var keys={};
addEventListener('keydown',function(e){keys[e.code]=true;if(e.code==='Space')launch();});
addEventListener('keyup',function(e){keys[e.code]=false;});
cv.addEventListener('touchstart',function(e){moveT(e);launch();e.preventDefault();});
cv.addEventListener('touchmove',function(e){moveT(e);e.preventDefault();});
cv.addEventListener('mousemove',function(e){
  var r=cv.getBoundingClientRect();paddle.x=(e.clientX-r.left)*(W/r.width);clamp();
});
cv.addEventListener('click',launch);
function moveT(e){
  var r=cv.getBoundingClientRect();
  paddle.x=(e.touches[0].clientX-r.left)*(W/r.width);clamp();
}
function clamp(){paddle.x=Math.max(paddle.w/2,Math.min(W-paddle.w/2,paddle.x));}
function launch(){
  if(state==='play'&&stuck){
    stuck=false;
    var a=(-0.75+Math.random()*1.5)*0.7;
    ball.vx=Math.sin(a)*ball.sp;ball.vy=-Math.cos(a)*ball.sp;
  }
}
var last=0;
function loop(ts){
  if(state!=='play')return;
  requestAnimationFrame(loop);
  var dt=Math.min((ts-last)/16.7,3);last=ts;
  if(keys.ArrowLeft){paddle.x-=7*dt;clamp();}
  if(keys.ArrowRight){paddle.x+=7*dt;clamp();}
  if(stuck){ball.x=paddle.x;ball.y=H-64;}
  else{
    ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
    if(ball.x<8){ball.x=8;ball.vx*=-1;}
    if(ball.x>W-8){ball.x=W-8;ball.vx*=-1;}
    if(ball.y<8){ball.y=8;ball.vy*=-1;}
    // 패들
    if(ball.vy>0&&ball.y>H-52&&ball.y<H-38&&Math.abs(ball.x-paddle.x)<paddle.w/2+8){
      var rel=(ball.x-paddle.x)/(paddle.w/2);
      var ang=rel*1.05;
      ball.vx=Math.sin(ang)*ball.sp;ball.vy=-Math.cos(ang)*ball.sp;
    }
    // 벽돌
    for(var i=0;i<bricks.length;i++){
      var b=bricks[i];
      if(ball.x>b.x-8&&ball.x<b.x+b.w+8&&ball.y>b.y-8&&ball.y<b.y+b.h+8){
        var ox=Math.min(ball.x-(b.x-8),(b.x+b.w+8)-ball.x);
        var oy=Math.min(ball.y-(b.y-8),(b.y+b.h+8)-ball.y);
        if(ox<oy)ball.vx*=-1;else ball.vy*=-1;
        b.hp--;
        if(b.hp<=0){bricks.splice(i,1);score+=10*level;}
        else{score+=5;}
        sync();break;
      }
    }
    if(!bricks.length){level++;score+=100*level;paddle.w=Math.max(92-(level-1)*6,56);newLevel();sync();}
    if(ball.y>H+14){
      lives--;sync();
      if(lives<=0){gameOver();return;}
      stuck=true;
    }
  }
  // 렌더
  ctx.clearRect(0,0,W,H);
  bricks.forEach(function(b){
    ctx.fillStyle=b.c;
    ctx.globalAlpha=b.hp>1?1:0.92;
    ctx.fillRect(b.x,b.y,b.w,b.h);
    if(b.hp>1){ctx.strokeStyle='#fff';ctx.globalAlpha=0.5;ctx.strokeRect(b.x+2,b.y+2,b.w-4,b.h-4);}
    ctx.globalAlpha=1;
  });
  ctx.fillStyle='#e8e6e3';
  ctx.beginPath();ctx.arc(ball.x,ball.y,7,0,7);ctx.fill();
  ctx.fillStyle='#d97757';
  ctx.fillRect(paddle.x-paddle.w/2,H-46,paddle.w,10);
  if(stuck){ctx.fillStyle='#9c9a94';ctx.font='13px monospace';ctx.textAlign='center';ctx.fillText('클릭/터치/스페이스로 발사',W/2,H-90);}
}
function gameOver(){
  state='over';
  if(score>hi){hi=score;localStorage.setItem('brick_hi',hi);}
  sync();
  overlay.style.display='flex';
  overlay.querySelector('h2').textContent='GAME OVER';
  overlay.querySelector('p').innerHTML='점수 <b style="color:#e0c07e">'+score+'</b> · 레벨 '+level+'<br>최고기록 '+hi;
  var _sb=document.getElementById('g-share')||document.createElement('button');
  if(!_sb.id){_sb.id='g-share';_sb.style.cssText='margin-top:8px;background:transparent;border:1px solid #3e3e3a;border-radius:8px;color:#e8e6e3;font:inherit;padding:9px 18px;cursor:pointer;';overlay.querySelector('div,p')&&overlay.appendChild(_sb);}
  _sb.textContent='📤 점수 자랑하기';
  _sb.onclick=function(){var t='벽돌깨기에서 '+score+"점 (레벨 "+level+")" +'! 나 이겨봐 🕹️ '+location.origin+location.pathname; if(navigator.share){navigator.share({text:t});}else{navigator.clipboard.writeText(t).then(function(){alert('복사됐어요!');});}};
  startBtn.textContent='다시 도전';
}
startBtn.onclick=function(){
  overlay.style.display='none';
  reset();state='play';last=performance.now();
  requestAnimationFrame(loop);
};
})();
</script>
</body>
