<h1>🍉 수박게임</h1>
<div class="sub">마우스/터치로 조준 → 클릭/떼면 낙하 · 같은 과일끼리 합치기</div>
<div id="wrap">
  <canvas id="cv" width="360" height="560"></canvas>
  <div id="overlay">
    <h2>SUIKA</h2>
    <p>같은 과일 두 개를 붙이면 하나로 합쳐져요.<br>체리 → 딸기 → … → 🍉 수박을 목표로!<br>과일이 위 경계선을 넘으면 게임오버.</p>
    <button id="start">게임 시작</button>
  </div>
</div>
<div class="hud"><span>SCORE <b id="sc">0</b></span><span>다음 <b id="nx">·</b></span><span>BEST <b id="hi">0</b></span></div>
<div class="foot"><div>🎮 <a href="/games/">게임방</a> · 🏠 <a href="/">에디슨의 놀이터</a></div></div>
<script>
(function(){
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var W=360,H=560;
var TOP=70;            // 게임오버 경계선 (이 위로 과일이 안정되면 아웃)
var GRAV=0.42, REST=0.15, FRICT=0.995, WALL=0.35;
var scE=document.getElementById('sc'),nxE=document.getElementById('nx'),hiE=document.getElementById('hi');
var overlay=document.getElementById('overlay'),startBtn=document.getElementById('start');
var hi=+localStorage.getItem('suika_hi')||0;hiE.textContent=hi;

// 과일 단계: 반지름 r, 색, 이모지, 합칠 때 점수
var FRUITS=[
  {r:14, c:'#e06666', e:'🍒', name:'체리'},
  {r:20, c:'#e0787e', e:'🍓', name:'딸기'},
  {r:27, c:'#c58fd6', e:'🍇', name:'포도'},
  {r:34, c:'#e0a86e', e:'🍊', name:'귤'},
  {r:42, c:'#e08a5e', e:'🍎', name:'사과'},
  {r:50, c:'#d97757', e:'🍑', name:'복숭아'},
  {r:60, c:'#e0c07e', e:'🍍', name:'파인애플'},
  {r:72, c:'#7fb069', e:'🍈', name:'멜론'},
  {r:86, c:'#5a9e4e', e:'🍉', name:'수박'}
];
// 새로 떨어뜨리는 건 작은 과일(0~4단계)만
var DROPMAX=4;

var state='idle',score,balls,cur,next,dropX,cooldown,overLine,idSeq;

function reset(){
  score=0;balls=[];idSeq=1;cooldown=0;overLine=0;
  dropX=W/2;
  cur=randDrop();next=randDrop();
  sync();
}
function randDrop(){return Math.floor(Math.random()*(DROPMAX+1));}
function sync(){scE.textContent=score;nxE.textContent=FRUITS[next].e;hiE.textContent=hi;}

function addBall(x,y,lvl){
  balls.push({id:idSeq++,x:x,y:y,vx:0,vy:0,lvl:lvl,merged:false,born:performance.now()});
}

// ---- 입력: 낙하 위치 조준 ----
function px(clientX){var r=cv.getBoundingClientRect();return (clientX-r.left)*(W/r.width);}
function aim(x){var rr=FRUITS[cur].r;dropX=Math.max(rr+2,Math.min(W-rr-2,x));}
cv.addEventListener('mousemove',function(e){if(state==='play')aim(px(e.clientX));});
cv.addEventListener('click',function(e){if(state==='play'){aim(px(e.clientX));drop();}});
cv.addEventListener('touchmove',function(e){if(state==='play'){aim(px(e.touches[0].clientX));}e.preventDefault();},{passive:false});
cv.addEventListener('touchend',function(e){if(state==='play')drop();e.preventDefault();},{passive:false});

function drop(){
  if(cooldown>0)return;
  addBall(dropX, TOP-4, cur);
  cur=next;next=randDrop();
  cooldown=22; // 프레임: 연속 낙하 방지
  sync();
}

// ---- 물리 ----
function physics(dt){
  var i,j,a,b;
  // 적분 + 벽/바닥
  for(i=0;i<balls.length;i++){
    a=balls[i];
    a.vy+=GRAV*dt;
    a.vx*=FRICT;a.vy*=FRICT;
    a.x+=a.vx*dt;a.y+=a.vy*dt;
    var r=FRUITS[a.lvl].r;
    if(a.x<r){a.x=r;a.vx=Math.abs(a.vx)*WALL;}
    if(a.x>W-r){a.x=W-r;a.vx=-Math.abs(a.vx)*WALL;}
    if(a.y>H-r){a.y=H-r;a.vy=-Math.abs(a.vy)*REST;a.vx*=0.9;}
  }
  // 충돌 해소 반복 (안정성)
  var ITER=5;
  for(var k=0;k<ITER;k++){
    for(i=0;i<balls.length;i++){
      a=balls[i];
      for(j=i+1;j<balls.length;j++){
        b=balls[j];
        var ra=FRUITS[a.lvl].r, rb=FRUITS[b.lvl].r, rs=ra+rb;
        var dx=b.x-a.x, dy=b.y-a.y;
        var d2=dx*dx+dy*dy;
        if(d2>=rs*rs || d2===0) continue;
        var d=Math.sqrt(d2);
        // 같은 단계 + 아직 안 합쳐졌으면 병합
        if(a.lvl===b.lvl && !a.merged && !b.merged && a.lvl<FRUITS.length-1){
          merge(a,b);
          continue;
        }
        // 위치 분리
        var ov=(rs-d);
        var nx=dx/d, ny=dy/d;
        var push=ov/2;
        a.x-=nx*push; a.y-=ny*push;
        b.x+=nx*push; b.y+=ny*push;
        // 속도 반발 (부드럽게)
        var rvx=b.vx-a.vx, rvy=b.vy-a.vy;
        var vn=rvx*nx+rvy*ny;
        if(vn<0){
          var imp=-(1+REST)*vn/2;
          a.vx-=imp*nx; a.vy-=imp*ny;
          b.vx+=imp*nx; b.vy+=imp*ny;
        }
      }
    }
    // 반복 중 벽 재보정
    for(i=0;i<balls.length;i++){
      a=balls[i];var r=FRUITS[a.lvl].r;
      if(a.x<r)a.x=r; if(a.x>W-r)a.x=W-r; if(a.y>H-r)a.y=H-r;
    }
  }
  // 병합 마킹된 것 제거
  for(i=balls.length-1;i>=0;i--){if(balls[i].merged)balls.splice(i,1);}
}

function merge(a,b){
  a.merged=true;b.merged=true;
  var lvl=a.lvl+1;
  var mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
  addBall(mx,my,lvl);
  var nb=balls[balls.length-1];
  nb.vy=-1.4; // 살짝 튀는 느낌
  score += (lvl+1)*(lvl+1); // 클수록 점수 급증
  if(lvl===FRUITS.length-1) score+=100; // 수박 완성 보너스
  if(score>hi){hi=score;localStorage.setItem('suika_hi',hi);}
  sync();
}

// ---- 게임오버 판정: 과일이 경계선 위에서 느리게 머물면 아웃 ----
function checkOver(){
  var danger=false;
  for(var i=0;i<balls.length;i++){
    var a=balls[i];var r=FRUITS[a.lvl].r;
    // 방금 태어난 과일은 유예
    if(performance.now()-a.born<900) continue;
    if(a.y-r < TOP && Math.abs(a.vy)<0.6){danger=true;break;}
  }
  if(danger){overLine++; if(overLine>60){gameOver();}}
  else overLine=Math.max(0,overLine-2);
}

// ---- 렌더 ----
function render(){
  ctx.clearRect(0,0,W,H);
  // 경계선
  ctx.strokeStyle=overLine>10?'#e07e7e':'#3e3e3a';
  ctx.setLineDash([6,6]);ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(0,TOP);ctx.lineTo(W,TOP);ctx.stroke();
  ctx.setLineDash([]);
  // 과일들
  for(var i=0;i<balls.length;i++){
    drawFruit(balls[i].x,balls[i].y,balls[i].lvl,1);
  }
  // 조준 가이드 + 대기 과일
  if(state==='play'){
    var rr=FRUITS[cur].r;
    if(cooldown<=0){
      ctx.strokeStyle='rgba(217,119,87,0.35)';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(dropX,TOP);ctx.lineTo(dropX,H);ctx.stroke();
      drawFruit(dropX,TOP-4,cur,0.95);
    }
  }
}
function drawFruit(x,y,lvl,alpha){
  var f=FRUITS[lvl];
  ctx.globalAlpha=alpha;
  ctx.beginPath();ctx.arc(x,y,f.r,0,7);
  ctx.fillStyle=f.c;ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.18)';ctx.lineWidth=2;ctx.stroke();
  // 이모지 라벨
  ctx.globalAlpha=alpha;
  ctx.font=(f.r*1.15|0)+'px serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(f.e,x,y+1);
  ctx.globalAlpha=1;
}

var last=0;
function loop(ts){
  if(state!=='play')return;
  requestAnimationFrame(loop);
  var dt=Math.min((ts-last)/16.7,2.2);last=ts;
  if(cooldown>0)cooldown-=dt;
  physics(dt);
  checkOver();
  render();
}

function gameOver(){
  state='over';
  if(score>hi){hi=score;localStorage.setItem('suika_hi',hi);}
  sync();
  overlay.style.display='flex';
  overlay.querySelector('h2').textContent='GAME OVER';
  overlay.querySelector('p').innerHTML='점수 <b style="color:#e0c07e">'+score+'</b><br>최고기록 '+hi;
  var _sb=document.getElementById('g-share');
  if(!_sb){_sb=document.createElement('button');_sb.id='g-share';_sb.style.cssText='margin-top:8px;background:transparent;border:1px solid #3e3e3a;border-radius:8px;color:#e8e6e3;font:inherit;padding:9px 18px;cursor:pointer;';overlay.appendChild(_sb);}
  _sb.textContent='📤 점수 자랑하기';
  _sb.onclick=function(){var t='수박게임에서 '+score+'점! 나 이겨봐 🍉 '+location.origin+location.pathname; if(navigator.share){navigator.share({text:t});}else{navigator.clipboard.writeText(t).then(function(){alert('복사됐어요!');});}};
  startBtn.textContent='다시 도전';
  if(window.PFRank)PFRank.end('suika',score,{label:'수박게임',unit:'점'});
}

startBtn.onclick=function(){
  overlay.style.display='none';
  reset();state='play';last=performance.now();
  requestAnimationFrame(loop);
  render();
};
render();
})();
</script>
