<h1>⚫ 오목</h1>
<div class="sub">컴퓨터 AI와 대결 · 내가 흑(선공) · 가로·세로·대각선 5개를 먼저 이으면 승리</div>
<div id="wrap">
  <canvas id="cv" width="450" height="450"></canvas>
  <div id="overlay">
    <h2>오목 (AI 대결)</h2>
    <p>내가 <b>흑</b>을 잡고 먼저 둡니다. 컴퓨터는 <b>백</b>.<br>가로·세로·대각선으로 <b>5개</b>를 먼저 이으면 승리!</p>
    <div class="diffsel" id="diffOv" style="margin-bottom:16px;">
      <button data-d="easy">쉬움</button>
      <button data-d="normal" class="on">보통</button>
      <button data-d="hard">어려움</button>
    </div>
    <button id="start">게임 시작</button>
  </div>
</div>
<div class="hud">
  <span id="turn"></span>
  <span class="diffsel" id="diffHud">
    <button data-d="easy">쉬움</button>
    <button data-d="normal" class="on">보통</button>
    <button data-d="hard">어려움</button>
  </span>
  <button id="rst" style="background:transparent;border:1px solid #3e3e3a;color:#e8e6e3;padding:6px 14px;border-radius:8px;font:inherit;cursor:pointer;">다시</button>
</div>

<script>

(function(){
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var N=15,PAD=18,S=(cv.width-PAD*2)/(N-1);
var board,turn,over,moves,busy;
var turnE=document.getElementById('turn');
var HUMAN=1,AI=2;
var diff='normal';

// ── 난이도 파라미터 ──
// atk: 내 공격 가중, def: 상대 위협 차단 가중, rnd: 착수 무작위성, look: 1수 앞 상대 위협 예측
var DIFF={
  easy:  {atk:1.0, def:0.55, rnd:0.30, look:false, label:'쉬움'},
  normal:{atk:1.0, def:0.90, rnd:0.05, look:false, label:'보통'},
  hard:  {atk:1.0, def:1.00, rnd:0.00, look:true,  label:'어려움'}
};

function inb(x,y){return x>=0&&x<N&&y>=0&&y<N;}
function reset(){board=[];for(var i=0;i<N;i++){board.push(new Array(N).fill(0));}turn=HUMAN;over=false;moves=0;busy=false;draw();upd();}
function upd(){
  if(over)return;
  turnE.innerHTML=busy?'<b style="color:#e0c07e">컴퓨터 생각 중…</b>'
    :'차례: <b style="color:'+(turn===HUMAN?'#e8e6e3':'#e0c07e')+'">'+(turn===HUMAN?'⚫ 나(흑)':'⚪ 컴퓨터(백)')+'</b>';
}
function draw(){
  ctx.fillStyle='#d9b98a';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.strokeStyle='#5c4a30';ctx.lineWidth=1;
  for(var i=0;i<N;i++){ctx.beginPath();ctx.moveTo(PAD,PAD+i*S);ctx.lineTo(cv.width-PAD,PAD+i*S);ctx.stroke();ctx.beginPath();ctx.moveTo(PAD+i*S,PAD);ctx.lineTo(PAD+i*S,cv.height-PAD);ctx.stroke();}
  for(var y=0;y<N;y++)for(var x=0;x<N;x++){if(board[y][x]){ctx.beginPath();ctx.arc(PAD+x*S,PAD+y*S,S*0.42,0,7);ctx.fillStyle=board[y][x]===HUMAN?'#1a1a1a':'#f5f5f5';ctx.fill();ctx.strokeStyle='#555';ctx.stroke();}}
}
// 5목 판정(기존 로직 유지)
function win(x,y,p){var dirs=[[1,0],[0,1],[1,1],[1,-1]];for(var d=0;d<4;d++){var cnt=1;for(var s=-1;s<=1;s+=2){var nx=x+dirs[d][0]*s,ny=y+dirs[d][1]*s;while(inb(nx,ny)&&board[ny][nx]===p){cnt++;nx+=dirs[d][0]*s;ny+=dirs[d][1]*s;}}if(cnt>=5)return true;}return false;}

// ── AI 휴리스틱 평가 ──
// 한 방향의 연속 길이·양끝 열림을 패턴 점수로 매핑
function patVal(count,open){
  if(count>=5)return 100000;                 // 5목 완성(즉시 승)
  if(count===4)return open===2?10000:open===1?5000:0;   // 열린4 / 닫힌4
  if(count===3)return open===2?1000:open===1?100:0;     // 열린3 / 닫힌3
  if(count===2)return open===2?100:open===1?10:0;
  if(count===1)return open===2?10:open===1?1:0;
  return 0;
}
// (x,y)에 p를 놓았다고 가정하고(이미 놓인 상태) 특정 축의 연속수·열림 계산
function runInfo(x,y,dx,dy,p){
  var count=1,fx=x+dx,fy=y+dy;
  while(inb(fx,fy)&&board[fy][fx]===p){count++;fx+=dx;fy+=dy;}
  var fOpen=inb(fx,fy)&&board[fy][fx]===0;
  var bx=x-dx,by=y-dy;
  while(inb(bx,by)&&board[by][bx]===p){count++;bx-=dx;by-=dy;}
  var bOpen=inb(bx,by)&&board[by][bx]===0;
  return {count:count,open:(fOpen?1:0)+(bOpen?1:0)};
}
// 빈 칸 (x,y)에 p가 두면 만들어지는 위협 총점 + 5목 여부
var DIRS4=[[1,0],[0,1],[1,1],[1,-1]];
function scoreMove(x,y,p){
  board[y][x]=p;
  var total=0,w=false;
  for(var d=0;d<4;d++){var r=runInfo(x,y,DIRS4[d][0],DIRS4[d][1],p);if(r.count>=5)w=true;total+=patVal(r.count,r.open);}
  board[y][x]=0;
  return {score:total,win:w};
}
// 기존 돌 근처(반경 2) 빈 칸만 후보로
function candidates(){
  var seen={},list=[],any=false,R=2;
  for(var y=0;y<N;y++)for(var x=0;x<N;x++){
    if(!board[y][x])continue;any=true;
    for(var dy=-R;dy<=R;dy++)for(var dx=-R;dx<=R;dx++){
      var nx=x+dx,ny=y+dy;
      if(inb(nx,ny)&&!board[ny][nx]){var k=ny*N+nx;if(!seen[k]){seen[k]=1;list.push({x:nx,y:ny});}}
    }
  }
  if(!any)list.push({x:(N/2|0),y:(N/2|0)});
  return list;
}
function aiPlace(){
  var cs=candidates();
  var P=DIFF[diff],chosen=null;
  // 1) 내가 이기는 수 있으면 즉시
  for(var i=0;i<cs.length;i++){if(scoreMove(cs[i].x,cs[i].y,AI).win){chosen=cs[i];break;}}
  // 2) 상대가 다음에 이기면 그 자리 차단
  if(!chosen){for(var i=0;i<cs.length;i++){if(scoreMove(cs[i].x,cs[i].y,HUMAN).win){chosen=cs[i];break;}}}
  // 3) 공격/수비 가중 평가
  if(!chosen){
    var best=-1e18,bestList=[];
    for(var i=0;i<cs.length;i++){
      var c=cs[i];
      var atk=scoreMove(c.x,c.y,AI).score;
      var def=scoreMove(c.x,c.y,HUMAN).score;
      var v=atk*P.atk+def*P.def;
      if(P.look){                                  // 어려움: 이 수를 둔 뒤 상대 최고 위협을 감점
        board[c.y][c.x]=AI;
        var oppBest=0;
        for(var j=0;j<cs.length;j++){if(cs[j].x===c.x&&cs[j].y===c.y)continue;var os=scoreMove(cs[j].x,cs[j].y,HUMAN).score;if(os>oppBest)oppBest=os;}
        board[c.y][c.x]=0;
        v-=oppBest*0.9;
      }
      v+=Math.random()*P.rnd*1000;                 // 난이도별 무작위성
      if(v>best){best=v;bestList=[c];}
      else if(v===best){bestList.push(c);}
    }
    chosen=bestList.length?bestList[(Math.random()*bestList.length)|0]:cs[0];
  }
  board[chosen.y][chosen.x]=AI;draw();
  if(win(chosen.x,chosen.y,AI)){over=true;turnE.innerHTML='<b style="color:#d97757">⚪ 컴퓨터(백) 승리 😢</b>';return;}
  if(moves+countAI()>=N*N){over=true;turnE.innerHTML='<b style="color:#e0c07e">무승부 — 판이 꽉 찼어요</b>';return;}
  turn=HUMAN;busy=false;upd();
}
function countAI(){var c=0;for(var y=0;y<N;y++)for(var x=0;x<N;x++)if(board[y][x]===AI)c++;return c;}

cv.addEventListener('click',function(e){
  if(over||busy||turn!==HUMAN)return;
  var rect=cv.getBoundingClientRect(),sx=cv.width/rect.width;
  var x=Math.round(((e.clientX-rect.left)*sx-PAD)/S),y=Math.round(((e.clientY-rect.top)*sx-PAD)/S);
  if(!inb(x,y)||board[y][x])return;
  board[y][x]=HUMAN;moves++;draw();
  if(win(x,y,HUMAN)){
    over=true;
    turnE.innerHTML='<b style="color:#d97757">🎉 승리! ('+moves+'수)</b>';
    if(window.PFRank)PFRank.end('gomoku',moves,{label:'오목 (AI 상대 승리·둔 수)',unit:'수',lowerBetter:true});
    return;
  }
  if(moves+countAI()>=N*N){over=true;turnE.innerHTML='<b style="color:#e0c07e">무승부 — 판이 꽉 찼어요</b>';return;}
  turn=AI;busy=true;upd();
  setTimeout(aiPlace,420);
});

// ── 난이도 선택(오버레이 + HUD 동기화) ──
function setDiff(d){
  if(!DIFF[d])return;
  diff=d;
  ['diffOv','diffHud'].forEach(function(id){
    var box=document.getElementById(id);if(!box)return;
    [].forEach.call(box.querySelectorAll('button'),function(b){b.classList.toggle('on',b.getAttribute('data-d')===d);});
  });
}
['diffOv','diffHud'].forEach(function(id){
  document.getElementById(id).addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    var d=b.getAttribute('data-d');
    var changed=(d!==diff);
    setDiff(d);
    if(id==='diffHud'&&changed)reset();   // 게임 중 난이도 변경 시 새 판
  });
});

document.getElementById('start').onclick=function(){document.getElementById('overlay').style.display='none';reset();};
document.getElementById('rst').onclick=reset;
reset();
})();

</script>
