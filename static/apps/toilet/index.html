<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>급할 땐 · 지하철 화장실</title>
<meta name="description" content="지하철역 화장실 위치를 게이트 안/밖·층·출구까지 빠르게 찾는 앱. 서울 1~8호선 지원.">
<meta name="theme-color" content="#2f7de1">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f6f7f9;--surface:#fff;--line:#e6e8eb;--ink:#1c2126;--muted:#7b828a;--accent:#2f7de1;--warn:#e08a2f;--in:#2f9e5b;--out:#8a7fd6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:-apple-system,"Apple SD Gothic Neo",Pretendard,sans-serif;color:var(--ink);background:var(--bg)}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{padding:9px 12px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;z-index:600;min-height:58px}
header h1{font-size:16px;margin:0;font-weight:800;display:flex;align-items:center;gap:7px;white-space:nowrap;flex:none}
.applogo{width:30px;height:30px;border-radius:8px;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.titlewrap{display:flex;flex-direction:column;line-height:1.12}
.titlewrap b{font-size:16px;font-weight:800}
header h1 small{font-weight:600;color:var(--muted);font-size:11px}
.seg{margin-left:auto;display:flex;background:#eef1f4;border-radius:11px;padding:3px;flex:none}
.seg button{border:0;background:transparent;padding:8px 13px;border-radius:9px;font-weight:800;color:var(--muted);font-size:13px;display:flex;align-items:center;gap:5px;transition:background .15s,color .15s}
.tabico{width:17px;height:17px;flex:none}
.seg button.on{background:var(--accent);color:#fff;box-shadow:0 2px 6px rgba(47,125,225,.4)}
.seg button.on .tabico{filter:brightness(0) invert(1)}
.lang{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 7px;font-size:13px;font-weight:800;color:var(--ink);flex:none;text-align:center}
#acctBtn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 9px;font-size:17px;line-height:1;cursor:pointer;flex:none}
@media(max-width:400px){header h1 small{display:none}.seg button{padding:8px 10px}.seg button span{display:none}.tabico{width:19px;height:19px}}
main{position:relative;flex:1;overflow:hidden}
.view{position:absolute;inset:0;display:none}
.view.on{display:block}
#map{position:absolute;inset:0}
#lineMap{position:absolute;inset:0;background:#fff}
#searchWrap{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:660;width:min(92%,440px)}
#search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;font-size:15px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.12);margin:0}
#suggest{background:#fff;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.16);margin-top:6px;overflow:hidden;display:none}
#suggest.on{display:block}
#suggest .sg{display:flex;align-items:center;gap:8px;padding:10px 14px;font-size:14px;cursor:pointer;border-bottom:1px solid #f0f2f4}
#suggest .sg:hover{background:#f6f8fb}
#suggest .sg .ln{width:20px;height:20px;border-radius:50%;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.net-lbl{background:transparent;border:0;box-shadow:none;color:#333;font-size:10px;font-weight:700;padding:0}
#toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);z-index:800;background:#1c2126;color:#fff;border-radius:12px;padding:11px 14px;display:none;align-items:center;gap:12px;box-shadow:0 4px 16px rgba(0,0,0,.3);font-size:14px;max-width:90%}
#toast.on{display:flex}
#toastBtn{border:0;background:transparent;color:#6db3ff;font-weight:800;font-size:14px;padding:2px 4px;white-space:nowrap}
#toastBtn:empty{display:none}
#legend{position:absolute;left:10px;bottom:12px;z-index:600;background:rgba(255,255,255,.94);border-radius:10px;padding:8px 10px;font-size:11px;box-shadow:0 2px 8px rgba(0,0,0,.15);display:none}
#legend.on{display:block}
#legend .lg{display:flex;align-items:center;gap:6px;margin:2px 0}
#legend .lg i{width:11px;height:11px;border-radius:50%;flex:none}
#legend .lg{gap:7px}
.lgpin{width:19px;height:19px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:inline-flex;align-items:center;justify-content:center;border:1.5px solid #fff;box-shadow:0 1px 2px rgba(0,0,0,.25);flex:none}
.lgpin b{transform:rotate(45deg);font-size:9px;line-height:1}
.lgico{width:20px;height:20px;flex:none;object-fit:contain;border-radius:5px}
.catpin b{font-size:15px;line-height:1}
#areaBtn{position:absolute;top:56px;left:50%;transform:translateX(-50%) translateY(-8px);z-index:655;background:var(--ink);color:#fff;border:0;border-radius:20px;padding:9px 16px;font-size:13px;font-weight:700;box-shadow:0 3px 12px rgba(0,0,0,.25);display:none;opacity:0;transition:opacity .2s,transform .2s}
#areaBtn.on{display:block;opacity:1;transform:translateX(-50%) translateY(0)}
#gate-legend{position:absolute;right:10px;bottom:12px;z-index:600;background:rgba(255,255,255,.95);border-radius:10px;padding:8px 10px;font-size:11px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
#gate-legend b{font-size:11px;display:block;margin-bottom:3px}
#gate-legend .gl{display:flex;align-items:center;gap:6px;margin:2px 0}
#gate-legend .gl i{width:13px;height:13px;border-radius:50%;flex:none;border:1.5px solid #111}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 0;background:var(--accent);transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}
.pin b{transform:rotate(45deg);color:#fff;font-size:13px}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.16);max-height:72%;overflow:auto;transform:translateY(102%);transition:transform .26s cubic-bezier(.2,.9,.3,1);z-index:700;padding-bottom:24px}
.sheet.up{transform:none}
.grabz{height:30px;display:flex;justify-content:center;align-items:center;touch-action:none;position:sticky;top:0;background:var(--surface);z-index:3;border-radius:20px 20px 0 0;cursor:grab}
.grabz:active{cursor:grabbing}
.grabz i{width:46px;height:5px;border-radius:3px;background:#cfd3d8}
.pad{padding:4px 18px}
.row{display:flex;align-items:center;gap:8px}
h2{font-size:20px;margin:2px 0}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;margin:2px 4px 2px 0}
.tag.in{background:#e7f5ec;color:var(--in)}
.tag.out{background:#eeecfa;color:var(--out)}
.card{border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.card h3{margin:0 0 6px;font-size:15px}
.kv{display:flex;gap:6px;font-size:13px;color:var(--muted);margin:3px 0}
.kv b{color:var(--ink);font-weight:700;min-width:52px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:800;background:var(--accent);color:#fff;margin-top:10px}
.btn.ghost{background:var(--bg);color:var(--ink)}
.fab{position:absolute;right:16px;bottom:22px;z-index:650;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;border:0;font-size:26px;box-shadow:0 4px 14px rgba(0,0,0,.24)}
.nudge{background:#fff7ec;border:1px solid #f0dcc0;color:#8a6a2f;border-radius:12px;padding:10px 12px;font-size:13px;margin:8px 0}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:var(--surface);margin:4px 0}
label{font-size:13px;font-weight:700;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;z-index:900}
.modal.on{display:flex}
.modal .box{background:var(--surface);width:100%;border-radius:20px 20px 0 0;padding:18px;max-height:90%;overflow:auto}
.line-col{display:flex;flex-direction:column;gap:2px;padding-left:0}
.line-st{display:flex;align-items:center;gap:10px;padding:6px 4px;border-radius:8px}
.line-st .dot{width:13px;height:13px;border-radius:50%;border:3px solid #2f7de1;background:#fff;flex:none;margin-left:-9px;box-shadow:0 0 0 2px #fff}
.line-st .lbl{font-weight:700}
.line-st .mini{font-size:11px;color:var(--in);font-weight:700;margin-left:auto}
.line-badge{display:inline-block;color:#fff;font-size:13px;font-weight:800;padding:3px 11px;border-radius:20px}
.st-tip{font-size:12px;font-weight:700;background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:2px 6px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.hint{font-size:12px;color:var(--muted)}
</style>

<div id="app">
  <header>
    <h1 id="title"><img class="applogo" src="icon-192.png" alt=""><span class="titlewrap"><b id="titleText">급할 땐</b><small id="subtitle">지하철 화장실</small></span></h1>
    <div class="seg">
      <button id="tabMap" class="on" data-v="map"><img class="tabico" src="tab-map.png" alt=""><span data-i="map">지도</span></button>
      <button id="tabLine" data-v="line"><img class="tabico" src="tab-line.png" alt=""><span data-i="line">노선도</span></button>
    </div>
    <select class="lang" id="lang"><option value="ko">한</option><option value="en">EN</option><option value="ja">日</option><option value="zh">中</option></select>
    <button id="acctBtn" title="계정">👤</button>
  </header>
  <main>
    <div id="searchWrap">
      <input id="search" type="search" autocomplete="off" placeholder="역 검색">
      <div id="suggest"></div>
    </div>
    <section class="view on" id="v-map">
      <div id="map"></div>
      <button id="areaBtn">🗺 이 지역 화장실 보기</button>
      <button class="fab" id="nearBtn" title="내 주변 화장실" style="bottom:88px;background:#2f9e6b">📍</button>
      <button class="fab" id="addBtn" title="내 화장실 추가">＋</button>
    </section>
    <section class="view" id="v-line">
      <div id="lineMap"></div>
    </section>
    <div class="sheet" id="sheet"><div class="grabz" id="grabz"><i></i></div><div class="pad" id="sheetBody"></div></div>
  </main>
</div>

<div class="modal" id="modal"><div class="box" id="modalBody"></div></div>
<div id="toast"><span id="toastMsg"></span><button id="toastBtn"></button></div>
<div id="legend"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="reviews.js"></script>
<script src="account.js"></script>
<script src="app.js"></script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}</script>
