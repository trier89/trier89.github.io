baseURL = 'https://planfully.ai.kr/'
languageCode = 'ko-kr'
defaultContentLanguage = 'ko'
title = '계획대로 느긋하게'
theme = 'hugo-theme-stack'
paginate = 10
buildFuture = true
timeZone = 'Asia/Seoul'
googleAnalytics = 'G-E8ECH6NV3Y'

[params]
  colorScheme.toggle = false
  colorScheme.default = 'dark'
  description = '생활에 쓸모있는 계산기 · 심리테스트 · 미니게임'
  mainSections = ['tools']
  favicon = ''

[params.sidebar]
  emoji = ''
  subtitle = '생활에 쓸모있는 계산기 · 심리테스트 · 미니게임'

[params.article]
  math = false
  toc = true
  readingTime = true

[params.comments]
  enabled = true
  provider = 'planfully'


[menu]
[[menu.main]]
  name = '도구방'
  url = '/tools/'
  weight = 2

[[menu.main]]
  name = '게임방'
  url = '/games/'
  weight = 3

[[menu.main]]
  name = '심리테스트'
  url = '/tests/'
  weight = 4

[[menu.main]]
  name = '데일리'
  url = 'https://planfully-daily.pages.dev/'
  weight = 5

[markup.goldmark.renderer]
  unsafe = true

[outputs]
  home = ['HTML', 'JSON', 'updates']

[outputFormats.updates]
  mediaType = 'application/json'
  baseName = 'updates'
  isPlainText = true
  rel = 'alternate'
