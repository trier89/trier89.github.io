name: Build Revit Add-in

# Windows 러너에서 애드인을 빌드해 "다운로드 후 바로 설치 가능한" 패키지를 만든다.
# 결과물은 이 워크플로 실행 페이지의 Artifacts에서 내려받을 수 있다.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/revit-dxf-3d-addon-56whi3
    paths:
      - 'revit-dxf-3d-addin/**'
      - '.github/workflows/build-revit-addin.yml'

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        revit: ['2024', '2025']

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build (Revit ${{ matrix.revit }})
        working-directory: revit-dxf-3d-addin/src
        run: dotnet build RevitDxfTo3D.csproj -c Release -p:RevitVersion=${{ matrix.revit }} --nologo

      - name: Package install-ready bundle
        shell: pwsh
        working-directory: revit-dxf-3d-addin
        run: |
          $ver = '${{ matrix.revit }}'
          $rel = "src/bin/Revit$ver/Release"
          if (-not (Test-Path "$rel/RevitDxfTo3D.dll")) { throw "빌드 산출물 없음: $rel" }

          $stage = "stage"
          $dest  = Join-Path $stage "src/bin/Revit$ver/Release"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null

          # install.ps1 이 기대하는 폴더 구조를 그대로 보존해 그대로 재사용
          Copy-Item "RevitDxfTo3D.addin" $stage -Force
          Copy-Item "install.ps1"        $stage -Force
          Copy-Item "$rel/*"             $dest  -Recurse -Force

          $note = @"
          RevitDxfTo3D — Revit $ver 설치 안내

          1) 이 폴더 전체를 압축 해제한 위치에서 PowerShell 을 엽니다.
          2) 아래 한 줄을 실행합니다:

             powershell -ExecutionPolicy Bypass -File install.ps1 -RevitVersion $ver

          3) Revit $ver 을 재시작하면 [애드인] 탭에 'DXF -> 3D' 패널이 생깁니다.

          install.ps1 이 파일 복사 + 다운로드 차단(Mark-of-the-Web) 해제까지 자동으로 처리합니다.
          이 패키지는 이미 빌드된 DLL을 포함하므로 PC에 .NET SDK 가 없어도 됩니다.
          "@
          Set-Content -Path (Join-Path $stage "INSTALL-먼저읽기.txt") -Value $note -Encoding UTF8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RevitDxfTo3D-Revit${{ matrix.revit }}
          path: revit-dxf-3d-addin/stage/**
          if-no-files-found: error
